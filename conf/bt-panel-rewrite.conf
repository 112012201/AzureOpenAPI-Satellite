# =============================================================================
#  AzureOpenAPI for Satellite v3.0 -- 宝塔面板(BT Panel / aaPanel)伪静态规则
#
#  放置位置: 网站 -> 设置 -> 伪静态
#  面板会把本文件 include 到 server{ } 内部(REWRITE-START 段)。
#
#  【覆盖原理】
#  nginx 禁止在同一个 server 内重复定义同名的 location(会报
#  "duplicate location" 并拒绝启动),因此这里不重复定义主配置的 location,
#  而是用更高优先级去"压过"它:
#     location =  /path    精确匹配    -> 优先级最高
#     location ^~ /path/   前缀匹配    -> 命中后不再检查任何正则 location,
#                                        可压过主配置里的 location ~ \.(js|css)$
#     location ~  正则      按出现顺序 -> 伪静态段在 PHP 段之后,故正则只用于
#                                        匹配 PHP 段不会匹配的路径
#
#  【v3.0 修订记录 —— 每一处都对应一个已实测缺陷】
#   1. `location = /` 内部重写到 index.html。
#      主配置的 `index index.php index.html` 会让 `/` 落到 index.php,而前端
#      控制器没有 `/` 路由,于是首页返回 404(实测 404 / 2150B = 404.html)。
#      index.html 是纯静态(实测 p50 1.3ms),必须继续静态直出。
#   2. 去掉 PHP-FPM 硬编码 socket,改为 `rewrite ^ /index.php last;`。
#      旧版写死 `unix:/tmp/php-cgi-82.sock`,压过了主配置的
#      `include enable-php-84.conf`,导致同一站点两套 PHP(实测 50 次
#      /v1/meta 使 php82 池 write_bytes +204800、php84 池 +0)。
#      改为内部重写后,版本由主配置单点决定。
#   3. 安全响应头按 nginx 的继承规则重新分配(详见第 6 节)。
#   4. 敏感扩展名正则拆分为两条,避免与新增资源(如 favicon.ico)互相干扰。
#
#  【不要放进本块】
#  limit_req_zone / map / upstream / geo 等 http 级指令放这里会报
#  "directive is not allowed here";需要 Nginx 层限流请在 http 段定义 zone。
#  应用内已内置限流(SATAPI_RATELIMIT_ENABLED=1),通常无需 Nginx 层限流。
# =============================================================================

# -----------------------------------------------------------------------------
# 1) 请求体上限(server 级,防止管理接口被塞大包)
# -----------------------------------------------------------------------------
client_max_body_size 1m;

# -----------------------------------------------------------------------------
# 1b) 首页 -> 前端控制器(由 PHP 渲染)
#
#     历史沿革:最初 `/` 落到 index.php(没有该路由)→ 404;随后改为 try_files
#     index.html 静态直出;v3.1 起 index 改为 PHP 渲染,因为三件事静态文件做不到:
#       ① 语言必须在发出第一个字节前就按 Accept-Language 决定,否则先闪一下
#          错误的语言再由脚本纠正;
#       ② 公告条由服务端渲染 —— 无 JS 也可见,且过期判定在服务端,客户端改时钟
#          无法让过期公告复活;
#       ③ 同意弹窗与 PoW 覆盖层要属于文档本身,禁用脚本的访客也能看到声明与
#          协议链接。
#     `location = /` 精确匹配,优先级最高;`/index`、`/home` 由下面的 §2b 处理。
# -----------------------------------------------------------------------------
location = / {
    rewrite ^ /index.php last;
}

# -----------------------------------------------------------------------------
# 2) 动态路由 -> 前端控制器 index.php
#
#    只匹配本服务的 API 路径;/tle_weather.php 这类旧文件名不会命中
#    (正则要求 tle 后面必须是 "/" 或结尾),仍由主配置的 PHP 段执行。
#
#    PHP 版本由主配置的 `include enable-php-84.conf` 单点决定,本文件不再
#    出现任何 php-cgi-*.sock 硬编码,避免版本分裂。
# -----------------------------------------------------------------------------
location ~ ^/(v1|tle|satnogs|amsat|health|status)(/.*)?$ {
    rewrite ^ /index.php last;
}

# -----------------------------------------------------------------------------
# 2b) 去扩展名(伪静态): 公开页面一律不带 .html,旧地址 301 到新地址
#
#     设计原则:**只列白名单精确匹配,绝不写通配 catch-all**。
#     理由: /tle/weather 这类无扩展名的 API 路径与 `try_files $uri $uri/ /index.php`
#     风格的通配规则天然冲突 —— 一旦引入通配,API 会被首页吞掉。白名单精确匹配
#     把可用面限死在已知页面,新增页面必须显式加一行(可审计)。
#
#     add_header 规则再次生效:每个 location 自己写了 add_header,就必须把 4 个
#     安全头抄全(见 §4 的铁律)。
# -----------------------------------------------------------------------------
location = /index {
    rewrite ^ /index.php last;
}

# /docs 由 PHP 提供:它是 PoW 覆盖的第二个页面,需要在 <head> 注入 Cap 的
# 资源覆盖点(见 lib/Docs.php)。文档正文仍是 docs.html,只注入这一个元素。
location = /docs {
    rewrite ^ /index.php last;
}

# 法务页由应用渲染(需要按 Accept-Language 选语言、三语切换、公告条与同意弹窗
# 属于文档本身),所以不做静态 try_files,统一交给前端控制器 —— 路由表与正文在
# lib/Legal.php。显式列名而非通配:理由见上面的白名单原则。
#
# /media-key 是加密媒体的密钥端点(lib/MediaKey.php):它不是 /v1 契约的一部分,
# 但同样必须交给 PHP —— 没有这条,兜底 location 会把它 404 掉,浏览器拿不到密钥,
# 视频与音乐就都解不开。
#
# /no-acceleration 是"为什么部分链接不提供"的说明(2C 文档),和法务页同一套渲染。
# 它曾经漏在这条名单外:首页页脚的 /no-accel -> 301 -> /no-acceleration 这条链
# 走到底是个 404,一份从首页一直链过去的合规说明,访问者是打不开的。
location ~ ^/(legal|privacy|terms|no-acceleration|error|verify|media-key)$ {
    rewrite ^ /index.php last;
}

# -----------------------------------------------------------------------------
# 2c) Cap 工作量证明（PoW）
#
#     反代只覆盖**动态**端点;widget 与 wasm 由 nginx 从 assets/vendor/cap/ 直出。
#     两个理由:
#       * 不会把 Cap 自带的 /settings 管理后台暴露到公网;
#       * 避免容器自带的安全头与本站策略重复(同一类坑已踩过两次)。
#
#     容器以 network_mode: host 运行,只监听 127.0.0.1:3000,并有 iptables 规则
#     丢弃非本机来源的 3000 端口。
# -----------------------------------------------------------------------------
# 只反代 Cap 的**动态**端点，并显式列出,不用 `^~ /cap/` 前缀匹配。
#
# 为什么不用前缀:`^~` 一旦命中就不再评估正则,于是 /cap/vendor/<file> 会被前缀
# 抢走并原样转发给容器(实测返回 Cap 的 {"success":false,"error":"NOT_FOUND"})。
# 这是 nginx 的匹配顺序( = > ^~ > 正则 > 前缀 ),不是配置笔误 —— 前缀"看起来
# 更宽更安全",实际把更具体的资源路径一起吞了。
#
# 另一条路是把 `location ^~ /cap/vendor/` 放在前缀之前,但正则与 ^~ 的相对顺序
# 不按文件顺序解析(^~ 永远优先),所以那样也无效。显式列出动态端点最不容易出错:
# 新增端点会被漏掉时表现为 404（可发现），而不是静默走到错误的后端。
#
# 反代的目标路径:proxy_pass 末尾带 "/" 时 nginx 把匹配到的前缀替换为 "/",
# 因此 /cap/{siteKey}/redeem → /{siteKey}/redeem、/cap/siteverify → /siteverify。
location ~ ^/cap/(?:challenge|health|health/live|siteverify|[A-Za-z0-9]+/(?:challenge|redeem|siteverify))$ {
    # 正则 location 里 `proxy_pass` **不允许**带 URI 部分（nginx 直接拒绝启动：
    # "proxy_pass cannot have URI part in location given by regular expression"）。
    # 所以前缀剥离用 rewrite……break 完成，再由无 URI 的 proxy_pass 转发改写后的
    # URI。这里 break 与普通前缀 location 的行为不同：它保留改写结果交给 proxy，
    # 而不会去重新匹配 location。
    rewrite ^/cap/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    # 挑战是每访客独有的一次性数据,绝不能被共享缓存
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # WASM 需要 wasm-unsafe-eval;widget 在浏览器端跑解题 worker。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
}

# widget 本体:从本地磁盘提供,并用 sub_filter 把内嵌的 jsDelivr 前缀改写到
# /cap/vendor/,因此没有运行时第三方外联。
#
# ⚠ sub_filter_types 必须显式加上 application/javascript。默认值是 text/html
#   一个,而这里的响应是 application/javascript —— 不加这一行 sub_filter 会
#   **完全静默失效**(实测响应 sha256 与磁盘文件逐字节相同)。
# ⚠ 若上游改名这些字符串,sub_filter 仍会失配。第二道保险是 assets/consent.js
#   加载 widget 前预设的 window.CAP_CUSTOM_* 覆盖点。升级 Cap 必须核对(见操作手册)。
location = /cap/widget.js {
    alias /www/wwwroot/satellite.api.authskin.xyz/assets/vendor/cap/cap.min.js;
    default_type application/javascript;
    sub_filter_once off;
    sub_filter_types application/javascript text/javascript;
    sub_filter "https://cdn.jsdelivr.net/npm/" "/cap/vendor/";
    # 改写后的响应不再是磁盘上的那份,必须去掉基于文件 mtime 的校验器,
    # 否则客户端可能用旧 ETag 命中未改写的缓存。
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

# 本地化解题资源。widget 内改写后的路径形如
#   /cap/vendor/@cap.js/wasm@0.0.8/browser/cap_wasm_bg.wasm
#   /cap/vendor/hashwx.wasm
# 磁盘上只保留扁平文件名,因此用正则 location + alias 把"最后一段"映射到
# assets/vendor/cap/<basename>。
#
# 为什么不用 `rewrite ... break`:实测在该 location(带 add_header)下改写不生效,
# 扁平名返回 404。而正则 location + alias 是 nginx 文档里"alias 后接捕获组"的
# 标准写法,且 alias 目标带扩展名,Content-Type 由扩展名自动确定。
#
# 必须保留这个正则:否则 /cap/vendor/x.wasm 会被 server 里通用的
# `\.(css|js|…|wasm)$` 静态 location 抢走,去 webroot 根下找文件而 404。
location ~ ^/cap/vendor/(?:.*/)?(?<capfile>[^/]+)$ {
    alias /www/wwwroot/satellite.api.authskin.xyz/assets/vendor/cap/$capfile;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
}

# 旧地址永久重定向到新地址。301 而不是 302:搜索引擎应当把权重转移到新 URL,
# 并且这是永久决定,不是临时跳转。
location = /index.html       { return 301 /; }
location = /index.php.html   { return 301 /; }
location = /docs.html        { return 301 /docs; }
location = /privacy.html     { return 301 /privacy; }
location = /terms.html       { return 301 /terms; }
location = /legal/index.html   { return 301 /legal; }
location = /legal/privacy.html { return 301 /privacy; }
location = /legal/terms.html   { return 301 /terms; }
# 同一个文档的旧地址(无扩展名版)。lib/Legal.php 仍然认这些路径,但规范地址只有
# 一个,其余全部 301 过去 —— 否则同一份协议会有两个都能打开、都自称规范的地址。
location = /legal/privacy           { return 301 /privacy; }
location = /legal/terms             { return 301 /terms; }
location = /legal/no-acceleration   { return 301 /no-acceleration; }
# 首页页脚的加速说明链接用的就是这个短地址(index.php 里也有一条同样的 301),
# 302 到不了 PHP,兜底 location 会把它 404 掉 —— 一条从首页一直链过去的链接,
# 走到底是个 404。这里直接由 nginx 回答,比走一趟前端控制器更可靠。
location = /no-accel                { return 301 /no-acceleration; }

# 错误页:用**兜底 location** 接管,而不是依赖 error_page。
#
# 实测结论(四种写法都试过,不是没试):
#   error_page 404 /404.php       → nginx 内置 146 字节页
#   error_page 404 /error         → 同上(经前端控制器也不行)
#   error_page 404 =200 /error    → 同上
#   error_page 404 /error.html    → 嵌套路径与带扩展名的生效了,顶层裸路径仍回退
# 而 nginx 内置错误页**没有任何安全头** —— 所以每一个打错的 URL 恰好是唯一
# 没有安全头的响应。
#
# 于是不再依赖 error_page:下面 §2d 的兜底正则 location 把未匹配到的请求交给静态
# 错误页(由 bin/build-error-page.php 生成,三语内嵌、JS 切换),并自己补全安全头。
# 好处是 HTTP 状态仍是 404(由兜底 location 里 nginx 自己产生),而不是靠 200 伪装。
#
# ⚠ 兜底正则必须放在所有其它正则 location **之后**:nginx 的正则按出现顺序匹配,
#   放前面会把 /cap/vendor/ 等资源全部吞掉。
# -----------------------------------------------------------------------------
# 3) 内部目录与敏感文件: 一律 404(用 ^~ / = 保证压过主配置的静态正则)
# -----------------------------------------------------------------------------
location ^~ /lib/    { return 404; }
location ^~ /data/   { return 404; }
location ^~ /logs/   { return 404; }
location ^~ /conf/   { return 404; }
location ^~ /bin/    { return 404; }
location ^~ /tests/  { return 404; }
location ^~ /schema/   { return 404; }
# partials/ 是内部模板,直连会泄露 Cookie 清单与同意状态;模板自身也有防直连守卫。
location ^~ /partials/ { return 404; }

location = /bootstrap.php { return 404; }
location = /common.php    { return 404; }
location = /router.php    { return 404; }

# 点文件(.gitignore/.user.ini/.env 等),保留标准 .well-known 目录
location ~ /\.(?!well-known) { return 404; }

# 缓存/日志/脚本/配置等敏感扩展名
location ~* \.(cache|lock|log|sh|ini|sqlite|bak|sql|md)$ { return 404; }
# 打包产物(绝不放在 webroot,这里兜底)
location ~* \.(tar|tgz|zip|7z|rar)$ { return 404; }
location ~* \.tar\.gz$ { return 404; }

# -----------------------------------------------------------------------------
# 4) 静态资源缓存策略
#
#    ⚠ 铁律(三次实测确认): nginx 的 add_header 是「本层一旦出现 add_header,
#      父层(server)的 add_header **整组丢弃**」。所以下面每一个自己写了
#      add_header 的 location,都必须把 4 个安全头**逐条抄进去**,否则该
#      location 的响应会一个安全头都没有。
#      实测反例:`location = /` 只写 Cache-Control 时,4 个安全头全为 0 份。
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# 首屏视频(DiskCache) —— 一年 + immutable
#
#   首页那段视频是几 MB,访客第二次来不该再下一次。URI 里带 ?v=<mtime hex>
#   (Season::film() 生成),换片就换 URL,所以长缓存不会让人一直看旧片子。
#
#   `expires off` 是刻意的:`expires 7d` 会自己再补一条 Cache-Control,两条
#   同时出现时客户端怎么合并由实现决定,而先出现的那条没有 immutable ——
#   /assets/ 现在就是这种双头状态。
# -----------------------------------------------------------------------------
location ^~ /assets/film/ {
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
    try_files $uri =404;
}

location ^~ /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
}

location = /openapi.yaml {
    default_type application/yaml;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300, s-maxage=600" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
}

location = /site.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
    expires 1d;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

location = /favicon.ico {
    try_files $uri =404;
    default_type image/x-icon;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
}

location ~* ^/(favicon-\d+x\d+\.png|apple-touch-icon\.png|icon-\d+\.png)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
}

location = /robots.txt {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
}

location = /sitemap.xml {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
}

location = /.well-known/security.txt {
    try_files $uri =404;
    default_type text/plain;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
}

# 未单独列出的静态文件兜底(404.html / oauth2-redirect.* / swagger-ui-* 等)。
# nginx 正则 location 按出现顺序匹配,更精确的精确/前缀 location 优先,
# 因此这条只会命中上面都没覆盖到的实际存在的文件。
location ~* \.(html|htm|css|js|mjs|json|xml|txt|svg|webmanifest|png|jpe?g|gif|ico|webp|woff2?|map|pdf)$ {
    try_files $uri =404;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

# -----------------------------------------------------------------------------
# 5) 传输压缩(server 级合法;会覆盖 http 段对本站点的 gzip_types 设置)
#    文本类接口压到约 1/4,4MB 的发射机 JSON 压到约 0.3MB
# -----------------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/yaml
    application/json
    application/problem+json
    application/javascript
    application/x-javascript
    application/xml
    application/yaml
    application/manifest+json
    image/svg+xml;

# -----------------------------------------------------------------------------
# 6) 安全响应头 —— 归口说明(结论来自三次实测,不是推断)
#
#    【原缺陷】单个动态响应: X-Content-Type-Options 出现 3 份,
#    Permissions-Policy 出现 2 份且**值冲突**(interest-cohort vs camera/mic/geo)。
#    来源: a) 站点 vhost(宝塔「网站->设置->安全」) b) 本文件 c) PHP。
#
#    【实测结论 1】nginx 的 add_header 到不了 `location ~ [^/]\.php` 的 fastcgi
#      响应 —— 除非写在 server 级或写在该 location 内。删掉本文件的 server 级
#      四头后,/v1/meta 的 nosniff 变成 0 份。
#
#    【实测结论 2】本文件 server 级的 add_header 对「动态响应」会被应用两次
#      (PHP 只发 3 个时,/v1/meta 出现 3 头 ×2 而 nosniff ×1),但对静态响应
#      只应用一次。
#
#    【实测结论 3】`location = /` / `location = /docs.html` / `location ^~ /assets/`
#      这类精确或前缀 location,一旦自己写了 add_header,server 级四头**全部丢弃**
#      —— 只留 Cache-Control 时,4 个安全头实测均为 0 份。
#
#    【归口方案(与三条结论一致)】
#      * 不在 server 级下发安全头(避免结论 2 的动态双发);
#      * 每个静态 location 显式补齐 4 头(应对结论 3);
#      * 动态响应由 PHP 下发(lib/Http/Response.php),因为它对 DNS/端口无关、
#        对 `php -S` / Apache 同样有效 —— 仅 PHP 侧能同时覆盖两种部署;
#        对应配置项 `http.security_headers_owner` = 'app'(默认);
#      * 站点 vhost 里重复的三行已在服务器上注释,备份见
#        /www/wwwroot/satbak/_nginx/*.vhost.conf.bak。
#
#    ⚠ 若把 `http.security_headers_owner` 改为 'nginx',动态响应会**失去全部
#      安全头**(结论 1);若要那样做,必须先把下面这几行取消注释并接受结论 2
#      的双发,或改用 `location ~ [^/]\.php` 内联写法。
#
#    如需 HTTPS 强制,确认全站已上证书后再打开 HSTS。
# -----------------------------------------------------------------------------
# add_header X-Content-Type-Options "nosniff" always;
# add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# add_header X-Frame-Options "SAMEORIGIN" always;
# add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# -----------------------------------------------------------------------------
# 7) 错误页
#
#    nginx 自身产生的 404 交给 /404.php 渲染(PHP 才能选语言、才能复用公告条
#    与同意弹窗)。应用输出的 problem+json 不受影响 —— 它走 fastcgi,状态码由
#    应用决定,nginx 不会替换其响应体。
#
#    `error_page 404` 只在宝塔 vhost 里声明一次(单点),本文件只提供 §2b 的
#    内部 location。nginx 不允许同一层出现两条 error_page 404。
#
#    ⚠ 若在宝塔「网站->设置->配置文件」里把 error_page 改回 /404.html,会退回
#      到静态错误页(无语言区分、无公告条)。DEPLOY.md 记录了这一点。
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# 2d) 兜底:未匹配的请求 → 404 + 静态错误页（必须位于所有正则 location 之后）
#
#     ⚠ 这里曾经是 `try_files /error.html =404;`,注释还写着"状态码由 nginx 自己
#     产生(=404)"。实测(2026-11-14,curl 一个不存在的路径)返回的是 **200** +
#     错误页正文。原因很直白:try_files 命中文件时是一次内部重定向,状态码取那个
#     文件的(=200);`=404` 只在文件缺失时才生效。于是全站任何一个打错的地址都是
#     "软 404" —— 正文写着 404,状态却是成功。搜索引擎的处理是:记进软 404 报告、
#     消耗抓取预算,并可能把它当作薄内容页索引。
#
#     现在改回 `return 404;`,由 server 级 `error_page 404 /error.html;`(在宝塔
#     vhost 里,单点)接管,状态码因此是真正的 404。这条链路已经被 /v1/ 下的未知
#     路由验证过 —— 它们返回的正是 404 + error.html。
#
#     错误页自己的安全头必须写在 error.html 的 location 里:error_page 是一次内部
#     重定向,原 location 的 add_header 不会跟过去。
# -----------------------------------------------------------------------------
location ~ ^/(?!cap/vendor/|assets/|error\.html) {
    return 404;
}

# 错误页(由 bin/build-error-page.php 生成的三语静态页)。`internal` 拒绝直接访问:
# 它是错误处理的产物,不是一个可以被引用的地址。
location = /error.html {
    internal;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
