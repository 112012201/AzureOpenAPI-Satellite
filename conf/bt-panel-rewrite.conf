# =============================================================================
#  Satellite Data API v2.2 -- 宝塔面板(BT Panel / aaPanel)伪静态规则
#
#  放置位置: 网站 -> 设置 -> 伪静态
#  面板会把本文件 include 到 server{ } 内部(REWRITE-START 段)。
#
#  【覆盖原理】
#  nginx 禁止在同一个 server 内重复定义同名的 location(会报
#  "duplicate location" 并拒绝启动),因此这里不重复定义主配置的 location,
#  而是用更高优先级去"压过"它:
#     location =  /path    精确匹配    -> 优先级最高
#     location ^~ /path/   前缀匹配    -> 命中后不再检查任何正则 location,
#                                        可压过主配置里的 location ~ \.(js|css)$
#     location ~  正则      按出现顺序 -> 伪静态段在 PHP 段之后,故正则只用于
#                                        匹配 PHP 段不会匹配的路径
#
#  【不要放进本块】
#  limit_req_zone / map / upstream / geo 等 http 级指令放这里会报
#  "directive is not allowed here";需要 Nginx 层限流请在 http 段定义 zone。
#  应用内已内置限流(SATAPI_RATELIMIT_ENABLED=1),通常无需 Nginx 层限流。
# =============================================================================

# -----------------------------------------------------------------------------
# 1) 请求体上限(server 级,防止管理接口被塞大包)
# -----------------------------------------------------------------------------
client_max_body_size 1m;

# -----------------------------------------------------------------------------
# 2) 动态路由 -> 前端控制器 index.php
#
#    只匹配本服务的 API 路径;/tle_weather.php 这类旧文件名不会命中
#    (正则要求 tle 后面必须是 "/" 或结尾),仍由主配置的 PHP 段执行。
#
#    fastcgi_pass 请按实际 PHP 版本改:
#      PHP 8.2 -> unix:/tmp/php-cgi-82.sock
#      PHP 8.1 -> unix:/tmp/php-cgi-81.sock
#    查看方法: 面板 -> 软件商店 -> PHP-x.x,或执行 ls /tmp/php-cgi-*.sock
# -----------------------------------------------------------------------------
location ~ ^/(v1|tle|satnogs|amsat|health|status)(/.*)?$ {
    include fastcgi_params;
    fastcgi_pass unix:/tmp/php-cgi-82.sock;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME     /index.php;
    fastcgi_index index.php;
    fastcgi_read_timeout 60s;
    fastcgi_buffers 16 32k;
    fastcgi_busy_buffers_size 64k;
}

# 若不确定 socket 路径,可改用下面这种"内部重写"写法(依赖主配置的 PHP 段):
# location ~ ^/(v1|tle|satnogs|amsat|health|status)(/.*)?$ {
#     rewrite ^ /index.php last;
# }

# -----------------------------------------------------------------------------
# 3) 内部目录与敏感文件: 一律 404(用 ^~ / = 保证压过主配置的静态正则)
# -----------------------------------------------------------------------------
location ^~ /lib/   { return 404; }
location ^~ /data/  { return 404; }
location ^~ /logs/  { return 404; }
location ^~ /conf/  { return 404; }
location ^~ /bin/   { return 404; }
location ^~ /tests/ { return 404; }

location = /bootstrap.php { return 404; }
location = /common.php    { return 404; }
location = /router.php    { return 404; }

# 点文件(.gitignore/.user.ini/.env 等),保留标准 .well-known 目录
location ~ /\.(?!well-known) { return 404; }

# 缓存/日志/脚本/配置等敏感扩展名
location ~* \.(cache|lock|log|sh|ini|sqlite|bak|tar|gz|zip|md)$ { return 404; }

# -----------------------------------------------------------------------------
# 4) 静态资源缓存策略
#    assets/ 为设计系统与 Swagger 主题,内容带版本才变,可长缓存
# -----------------------------------------------------------------------------
location ^~ /assets/ {
    expires 7d;
    access_log off;
}

location = /openapi.yaml {
    default_type application/yaml;
    add_header Cache-Control "public, max-age=300, s-maxage=600" always;
    add_header Access-Control-Allow-Origin "*" always;
    access_log off;
}

location = /docs.html {
    add_header Cache-Control "public, max-age=3600" always;
}

location = /site.webmanifest {
    default_type application/manifest+json;
    expires 1d;
}

# -----------------------------------------------------------------------------
# 5) 传输压缩(server 级合法;会覆盖 http 段对本站点的 gzip_types 设置)
#    文本类接口压到约 1/4,4MB 的发射机 JSON 压到约 0.4MB
# -----------------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/yaml
    application/json
    application/problem+json
    application/javascript
    application/x-javascript
    application/xml
    application/yaml
    application/manifest+json
    image/svg+xml;

# -----------------------------------------------------------------------------
# 6) 安全响应头(可选)
#    动态响应已由 PHP 输出 nosniff / Referrer-Policy / CORS,重复下发无副作用;
#    这里主要覆盖 docs.html、openapi.yaml 等静态文件。如需 HTTPS 强制,
#    确认全站已上证书后再打开 HSTS。
# -----------------------------------------------------------------------------
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# -----------------------------------------------------------------------------
# 7) 错误页(404.html 已随站点提供;主配置通常已设置,重复定义以本处为准)
# -----------------------------------------------------------------------------
error_page 404 /404.html;
