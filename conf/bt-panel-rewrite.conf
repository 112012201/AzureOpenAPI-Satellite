# =============================================================================
#  Satellite Data API v3.0 -- 宝塔面板(BT Panel / aaPanel)伪静态规则
#
#  放置位置: 网站 -> 设置 -> 伪静态
#  面板会把本文件 include 到 server{ } 内部(REWRITE-START 段)。
#
#  【覆盖原理】
#  nginx 禁止在同一个 server 内重复定义同名的 location(会报
#  "duplicate location" 并拒绝启动),因此这里不重复定义主配置的 location,
#  而是用更高优先级去"压过"它:
#     location =  /path    精确匹配    -> 优先级最高
#     location ^~ /path/   前缀匹配    -> 命中后不再检查任何正则 location,
#                                        可压过主配置里的 location ~ \.(js|css)$
#     location ~  正则      按出现顺序 -> 伪静态段在 PHP 段之后,故正则只用于
#                                        匹配 PHP 段不会匹配的路径
#
#  【v3.0 修订记录 —— 每一处都对应一个已实测缺陷】
#   1. `location = /` 内部重写到 index.html。
#      主配置的 `index index.php index.html` 会让 `/` 落到 index.php,而前端
#      控制器没有 `/` 路由,于是首页返回 404(实测 404 / 2150B = 404.html)。
#      index.html 是纯静态(实测 p50 1.3ms),必须继续静态直出。
#   2. 去掉 PHP-FPM 硬编码 socket,改为 `rewrite ^ /index.php last;`。
#      旧版写死 `unix:/tmp/php-cgi-82.sock`,压过了主配置的
#      `include enable-php-84.conf`,导致同一站点两套 PHP(实测 50 次
#      /v1/meta 使 php82 池 write_bytes +204800、php84 池 +0)。
#      改为内部重写后,版本由主配置单点决定。
#   3. 安全响应头按 nginx 的继承规则重新分配(详见第 6 节)。
#   4. 敏感扩展名正则拆分为两条,避免与新增资源(如 favicon.ico)互相干扰。
#
#  【不要放进本块】
#  limit_req_zone / map / upstream / geo 等 http 级指令放这里会报
#  "directive is not allowed here";需要 Nginx 层限流请在 http 段定义 zone。
#  应用内已内置限流(SATAPI_RATELIMIT_ENABLED=1),通常无需 Nginx 层限流。
# =============================================================================

# -----------------------------------------------------------------------------
# 1) 请求体上限(server 级,防止管理接口被塞大包)
# -----------------------------------------------------------------------------
client_max_body_size 1m;

# -----------------------------------------------------------------------------
# 1b) 首页静态直出(修复 / -> 404)
#     index.html 是自包含静态页,必须由 nginx 直接返回,不走 PHP。
# -----------------------------------------------------------------------------
location = / {
    try_files /index.html =404;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

# -----------------------------------------------------------------------------
# 2) 动态路由 -> 前端控制器 index.php
#
#    只匹配本服务的 API 路径;/tle_weather.php 这类旧文件名不会命中
#    (正则要求 tle 后面必须是 "/" 或结尾),仍由主配置的 PHP 段执行。
#
#    PHP 版本由主配置的 `include enable-php-84.conf` 单点决定,本文件不再
#    出现任何 php-cgi-*.sock 硬编码,避免版本分裂。
# -----------------------------------------------------------------------------
location ~ ^/(v1|tle|satnogs|amsat|health|status)(/.*)?$ {
    rewrite ^ /index.php last;
}

# -----------------------------------------------------------------------------
# 3) 内部目录与敏感文件: 一律 404(用 ^~ / = 保证压过主配置的静态正则)
# -----------------------------------------------------------------------------
location ^~ /lib/    { return 404; }
location ^~ /data/   { return 404; }
location ^~ /logs/   { return 404; }
location ^~ /conf/   { return 404; }
location ^~ /bin/    { return 404; }
location ^~ /tests/  { return 404; }
location ^~ /schema/ { return 404; }

location = /bootstrap.php { return 404; }
location = /common.php    { return 404; }
location = /router.php    { return 404; }

# 点文件(.gitignore/.user.ini/.env 等),保留标准 .well-known 目录
location ~ /\.(?!well-known) { return 404; }

# 缓存/日志/脚本/配置等敏感扩展名
location ~* \.(cache|lock|log|sh|ini|sqlite|bak|sql|md)$ { return 404; }
# 打包产物(绝不放在 webroot,这里兜底)
location ~* \.(tar|tgz|zip|7z|rar)$ { return 404; }
location ~* \.tar\.gz$ { return 404; }

# -----------------------------------------------------------------------------
# 4) 静态资源缓存策略
#
#    ⚠ 铁律(三次实测确认): nginx 的 add_header 是「本层一旦出现 add_header,
#      父层(server)的 add_header **整组丢弃**」。所以下面每一个自己写了
#      add_header 的 location,都必须把 4 个安全头**逐条抄进去**,否则该
#      location 的响应会一个安全头都没有。
#      实测反例:`location = /` 只写 Cache-Control 时,4 个安全头全为 0 份。
# -----------------------------------------------------------------------------
location ^~ /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
}

location = /openapi.yaml {
    default_type application/yaml;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300, s-maxage=600" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
}

location = /docs.html {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

location = /site.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
    expires 1d;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

location = /favicon.ico {
    try_files $uri =404;
    default_type image/x-icon;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
}

location ~* ^/(favicon-\d+x\d+\.png|apple-touch-icon\.png|icon-\d+\.png)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
}

location = /robots.txt {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
}

location = /sitemap.xml {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
}

location = /.well-known/security.txt {
    try_files $uri =404;
    default_type text/plain;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
}

# 未单独列出的静态文件兜底(404.html / oauth2-redirect.* / swagger-ui-* 等)。
# nginx 正则 location 按出现顺序匹配,更精确的精确/前缀 location 优先,
# 因此这条只会命中上面都没覆盖到的实际存在的文件。
location ~* \.(html|htm|css|js|mjs|json|xml|txt|svg|webmanifest|png|jpe?g|gif|ico|webp|woff2?|map|pdf)$ {
    try_files $uri =404;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

# -----------------------------------------------------------------------------
# 5) 传输压缩(server 级合法;会覆盖 http 段对本站点的 gzip_types 设置)
#    文本类接口压到约 1/4,4MB 的发射机 JSON 压到约 0.3MB
# -----------------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/yaml
    application/json
    application/problem+json
    application/javascript
    application/x-javascript
    application/xml
    application/yaml
    application/manifest+json
    image/svg+xml;

# -----------------------------------------------------------------------------
# 6) 安全响应头 —— 归口说明(结论来自三次实测,不是推断)
#
#    【原缺陷】单个动态响应: X-Content-Type-Options 出现 3 份,
#    Permissions-Policy 出现 2 份且**值冲突**(interest-cohort vs camera/mic/geo)。
#    来源: a) 站点 vhost(宝塔「网站->设置->安全」) b) 本文件 c) PHP。
#
#    【实测结论 1】nginx 的 add_header 到不了 `location ~ [^/]\.php` 的 fastcgi
#      响应 —— 除非写在 server 级或写在该 location 内。删掉本文件的 server 级
#      四头后,/v1/meta 的 nosniff 变成 0 份。
#
#    【实测结论 2】本文件 server 级的 add_header 对「动态响应」会被应用两次
#      (PHP 只发 3 个时,/v1/meta 出现 3 头 ×2 而 nosniff ×1),但对静态响应
#      只应用一次。
#
#    【实测结论 3】`location = /` / `location = /docs.html` / `location ^~ /assets/`
#      这类精确或前缀 location,一旦自己写了 add_header,server 级四头**全部丢弃**
#      —— 只留 Cache-Control 时,4 个安全头实测均为 0 份。
#
#    【归口方案(与三条结论一致)】
#      * 不在 server 级下发安全头(避免结论 2 的动态双发);
#      * 每个静态 location 显式补齐 4 头(应对结论 3);
#      * 动态响应由 PHP 下发(lib/Http/Response.php),因为它对 DNS/端口无关、
#        对 `php -S` / Apache 同样有效 —— 仅 PHP 侧能同时覆盖两种部署;
#        对应配置项 `http.security_headers_owner` = 'app'(默认);
#      * 站点 vhost 里重复的三行已在服务器上注释,备份见
#        /www/wwwroot/satbak/_nginx/*.vhost.conf.bak。
#
#    ⚠ 若把 `http.security_headers_owner` 改为 'nginx',动态响应会**失去全部
#      安全头**(结论 1);若要那样做,必须先把下面这几行取消注释并接受结论 2
#      的双发,或改用 `location ~ [^/]\.php` 内联写法。
#
#    如需 HTTPS 强制,确认全站已上证书后再打开 HSTS。
# -----------------------------------------------------------------------------
# add_header X-Content-Type-Options "nosniff" always;
# add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# add_header X-Frame-Options "SAMEORIGIN" always;
# add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# -----------------------------------------------------------------------------
# 7) 错误页(404.html 已随站点提供;主配置通常已设置,重复定义以本处为准)
#    ⚠ 不要在这里把 500/502/503/504 映射到 /404.html —— 应用输出的
#      RFC 9457 problem+json 更精确,错误页只用于 nginx 自身产生的 404。
#    ⚠ 已知限制:宝塔 vhost 里的 `error_page 404 /404.html` 会**替换掉**
#      应用为「未知路径」生成的 problem+json(实测 /v1/tle/xyz 返回 text/html)。
#      路由命中的错误(400/405/429/503)不受影响。若需要未知路径也返回
#      problem+json,请在宝塔「网站->设置->配置文件」中注释该行(见 DEPLOY.md)。
# -----------------------------------------------------------------------------
error_page 404 /404.html;
