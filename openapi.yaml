  # ---------------------------------------------------------------------------
  # System
  # ---------------------------------------------------------------------------
  /v1/meta:
    get:
      operationId: getServiceMeta
      summary: Service metadata and error catalogue
      description: |
        Self-describing service metadata, cached for 5 minutes: the endpoint
        list, the upstream `sources` (id, label, url, cache_ttl, parser,
        attribution), the enforced `limits`, the complete `errors` catalogue,
        the active `cache_backend`, the current `maintenance` states and the
        service `links`.
      tags: [System]
      x-endpoint-id: meta
      parameters: []
      x-cache-ttl: 300
      responses:
        '200':
          description: The service metadata document.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Last-Modified: { $ref: '#/components/headers/LastModified' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Cache-Status: { $ref: '#/components/headers/XCacheStatus' }
            X-Cache-Age: { $ref: '#/components/headers/XCacheAge' }
            X-Cache-TTL: { $ref: '#/components/headers/XCacheTTL' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetaEnvelope' }
              examples:
                document: { $ref: '#/components/examples/MetaDocument' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/health:
    get:
      operationId: getHealth
      summary: Aggregate health document
      description: |
        Aggregate health of the process, its caches and its upstreams:
        `status` (`ok` | `degraded`), `overall` (`ok` | `degraded` |
        `critical`), `timestamp`, `generated`, `service`, `version`,
        `api_version`, `uptime_seconds`, `checks` (Redis, storage, every tracked
        cache file, every maintenance state) and `metrics` (totals,
        per-endpoint and per-upstream counters).

        HTTP `200` is returned for `ok` and `degraded`; HTTP `503` when
        `overall` is `critical`. `?ui=1` returns the HTML dashboard instead of
        JSON (the same data as `/v1/status`).
      tags: [System]
      x-endpoint-id: health
      parameters:
        - $ref: '#/components/parameters/UiParam'
      responses:
        '200':
          description: Health document as JSON, or the HTML dashboard when `ui=1`.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Cache-Backend: { $ref: '#/components/headers/XCacheBackend' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthDocument' }
              examples:
                ok: { $ref: '#/components/examples/HealthOk' }
                degraded: { $ref: '#/components/examples/HealthDegraded' }
            text/html:
              schema: { type: string }
              examples:
                dashboard: { $ref: '#/components/examples/HealthDashboard' }
        '503':
          description: |
            `overall` is `critical`: no usable data could be produced. The body is
            the same health document as for `200` (so monitors can read the same
            fields from either answer); with `ui=1` the dashboard is rendered.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Health: { $ref: '#/components/headers/XHealth' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthDocument' }
              examples:
                critical: { $ref: '#/components/examples/HealthDegraded' }
            text/html:
              schema: { type: string }
              examples:
                dashboard: { $ref: '#/components/examples/HealthDashboard' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /v1/health/live:
    get:
      operationId: getHealthLive
      summary: Liveness probe
      description: |
        Liveness probe. Always answers `200` while the process is up and able to
        serve requests; it performs no cache or upstream checks.
      tags: [System]
      x-endpoint-id: health
      parameters: []
      responses:
        '200':
          description: The process is alive.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthLive' }
              examples:
                live: { $ref: '#/components/examples/HealthLive' }

  /v1/health/ready:
    get:
      operationId: getHealthReady
      summary: Readiness probe
      description: |
        Readiness probe. Answers `200` when data can be served and `503` when it
        cannot, reporting `status` (`ok` | `unavailable`), the `check` name
        `readiness`, `timestamp`, `overall`, the Redis state and every tracked
        cache as `fresh`, `stale` or `missing`.
      tags: [System]
      x-endpoint-id: health
      parameters: []
      responses:
        '200':
          description: The service is ready to serve data.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReady' }
              examples:
                ready: { $ref: '#/components/examples/HealthReady' }
        '503':
          description: |
            The service cannot serve data yet. As with `200`, the body is the
            readiness document - only the status code changes - so a probe can
            report *why* it is not ready.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Health: { $ref: '#/components/headers/XHealth' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReady' }
              examples:
                unavailable: { $ref: '#/components/examples/HealthReadyUnavailable' }

  /v1/status:
    get:
      operationId: getStatusDashboard
      summary: HTML status dashboard
      description: |
        Human-readable dashboard rendering exactly the data of `/v1/health`:
        cache ages, Redis and storage state, maintenance windows, metrics and
        upstream health.
      tags: [System]
      x-endpoint-id: health
      parameters: []
      responses:
        '200':
          description: The HTML status dashboard.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
          content:
            text/html:
              schema: { type: string }
              examples:
                dashboard: { $ref: '#/components/examples/HealthDashboard' }

  /v1/maintenance:
    get:
      operationId: listMaintenance
      summary: Per-endpoint maintenance state
      description: |
        Current maintenance state of every endpoint. Known ids: `tle_merge`,
        `tle_weather`, `tle_amateur`, `tle_amsat`, `tle_satnogs`,
        `satnogs_satellites`, `satnogs_transmitters`, `amsat_status`, `health`.
        An endpoint in maintenance answers `503` with a `maintenance` problem
        document carrying `endpoint`, `retry_after` and `until`.
      tags: [System]
      x-endpoint-id: health
      parameters: []
      responses:
        '200':
          description: The maintenance state of every endpoint.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceEnvelope' }
              examples:
                states: { $ref: '#/components/examples/MaintenanceList' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    post:
      operationId: updateMaintenance
      summary: Enable or disable maintenance for an endpoint
      description: |
        Administrator-only. Sets the maintenance state of one endpoint, or of
        `all` endpoints, and makes the affected documents stale so the next
        request revalidates upstream. The bearer token comes from the
        `SATAPI_ADMIN_TOKEN` environment variable (configuration key
        `admin.token`). When no token is configured the route answers `503` with
        an `unauthorized` problem document, because the admin surface is
        disabled rather than open.
      tags: [System]
      x-endpoint-id: health
      parameters: []
      security:
        - adminBearer: []
      requestBody:
        required: true
        description: The maintenance state to apply.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceUpdate' }
            examples:
              oneEndpoint: { $ref: '#/components/examples/MaintenanceEnableOne' }
              allEndpoints: { $ref: '#/components/examples/MaintenanceEnableAll' }
      responses:
        '200':
          description: The maintenance state was applied.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceApplyEnvelope' }
              examples:
                applied: { $ref: '#/components/examples/MaintenanceApplied' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/AdminDisabled' }

  # ---------------------------------------------------------------------------
  # Consent and proof of work
  #
  # These existed in the service before this document described them: the whole
  # subsystem (the acknowledgement contract, the 451 response, the Cap challenge
  # and its two endpoints) was missing from the spec, which meant a client reading
  # only the spec could not discover that a 451 was possible at all. That gap is
  # what these two paths close.
  # ---------------------------------------------------------------------------
  /v1/consent/status:
    get:
      operationId: getConsentStatus
      summary: Current acknowledgement contract and what this request has provided
      description: |
        Reports the documents that must be acknowledged, the current version, and
        the verdict for THIS request (read from `?consent=` or the `X-Consent`
        header).

        The contract is stateless on purpose: the acknowledgement is a query
        parameter or a header, never a signed token, so that every API response
        stays cacheable at the CDN. The trade-off is stated plainly: the
        acknowledgement is a client statement, not proof.
      tags: [System]
      parameters:
        - { name: consent, in: query, required: false, schema: { type: string }, description: 'Comma-separated document names, e.g. `privacy,terms`. Aliases such as `tos` and `privacy-policy` are accepted.', example: 'privacy,terms' }
        - { name: consent_version, in: query, required: false, schema: { type: integer, minimum: 1 }, description: 'Version of the documents the client agreed to. A mismatch with the published version yields `state: stale`.' }
      responses:
        '200':
          description: 'The contract plus this request''s verdict.'
          headers:
            X-Consent-Required: { $ref: '#/components/headers/XConsentRequired' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
          content:
            application/json:
              schema:
                type: object
                required: [meta, data]
                properties:
                  meta: { $ref: '#/components/schemas/Meta' }
                  data: { $ref: '#/components/schemas/ConsentStatus' }
              examples:
                unacknowledged:
                  summary: 'Nothing provided yet'
                  value:
                    meta: { service: AzureOpenAPI for Satellite, version: 3.3.1+ra, api_version: v1, generated: '2026-10-28T12:00:00Z', request_id: req_1a2b3c4d5e6f7a8b, elapsed_ms: 3, endpoint: { id: scdn, host: satellite.db.authskin.xyz, url: 'https://satellite.db.authskin.xyz', cdn: scdn, cdn_header: x-cache-status, status: new, testing: true, since: '2026-10-28' } }
                    data: { required: [privacy, terms], accepted: false, state: missing, version: 1, urls: { privacy: '/legal/privacy.html', terms: '/legal/terms.html' }, hint: 'Include ?consent=privacy,terms&consent_version=1 to acknowledge both documents.' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/consent/verify-pow:
    post:
      operationId: postVerifyPow
      summary: Redeem a solved proof-of-work challenge for a session cookie
      description: |
        Called by the browser after the Cap widget reports success. The service
        verifies the token against the Cap instance and, on success, answers with
        `cap_session` in `Set-Cookie`.

        Deliberately **fail-open**: an unreachable or slow Cap instance yields a
        pass plus a logged warning instead of locking every visitor out. A
        third-party challenge service going down must degrade the protection, never
        the site.
      tags: [System]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: 'Token produced by the Cap widget.' }
      responses:
        '200':
          description: 'Challenge solved; the session cookie is set when a session is in play.'
          headers:
            Set-Cookie: { description: '`cap_session` — proof-of-work session, 12 hours (`pow.session_ttl`).', schema: { type: string }, example: 'cap_session=…; Path=/; HttpOnly; SameSite=Lax; Max-Age=43200; Secure' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta: { $ref: '#/components/schemas/Meta' }
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
                      passed: { type: boolean }
                      fail_open: { type: boolean, description: 'True when the challenge could not be checked and the request was allowed through.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ---------------------------------------------------------------------------
  # Operator surface
  #
  # Not listed in `/v1/meta` endpoints, and not part of the public contract: on a
  # deployment with no `admin.token` configured, this route answers 404 (it does
  # not exist) rather than 401, so a probe cannot learn that an admin door is
  # there. It is documented here because a client that holds a token should not
  # have to read the source to find the payload shape.
  # ---------------------------------------------------------------------------
  /v1/admin/reload:
    post:
      operationId: postAdminReload
      summary: Hot reload — re-pull every source and overwrite the cached copy
      description: |
        Differs from the scheduled warmup in two ways that matter operationally:

          * TTL is ignored, so a reload seconds after the last fetch still hits the
            network instead of being a no-op;
          * it covers all seven datasets (four TLE sets, satellites, transmitters,
            AMSAT status), whereas `refresh --target=all` historically refreshed
            only the four TLE sets.

        The prepared snapshot is rebuilt from the NEW data rather than from the
        cache that was just replaced.

        Serialised behind a file lock: two overlapping reloads would double the
        upstream request rate for an identical result, and CelesTrak already blocks
        IPs it considers abusive.

        Authentication: `X-Admin-Token`, or `Authorization: Bearer <token>`, or
        `?token=`. The token is `admin.token` / `SATAPI_ADMIN_TOKEN` and is compared
        with a constant-time check. **No token configured means 404.**
      tags: [Admin]
      security:
        - adminToken: []
      parameters:
        - name: targets
          in: query
          required: false
          description: 'Comma-separated dataset ids. Omitted or `all` means every dataset.'
          schema:
            type: string
          example: 'weather,amsat'
      responses:
        '200':
          description: 'Every dataset refreshed and written.'
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { description: 'Always `no-store, private` — a reload is a state change and a cached copy of its report would be actively misleading.', schema: { type: string }, example: 'no-store, private' }
          content:
            application/json:
              schema:
                type: object
                required: [meta, data]
                properties:
                  meta: { $ref: '#/components/schemas/Meta' }
                  data:
                    type: object
                    required: [reload]
                    properties:
                      reload: { $ref: '#/components/schemas/ReloadReport' }
        '400':
          description: 'An unknown target was requested (`bad_request`); nothing is refreshed.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: 'Missing or wrong admin token (`unauthorized`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: 'No `admin.token` is configured on this deployment, so this route does not exist.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: 'Another reload is already running (`reload_in_progress`). The correct client behaviour is to retry, not to fail over.'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
