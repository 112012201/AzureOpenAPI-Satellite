# =============================================================================
# Components
# =============================================================================
components:

  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Static administrator token for `POST /v1/maintenance`, read from the
        `SATAPI_ADMIN_TOKEN` environment variable or the `admin.token`
        configuration key. Send it as `Authorization: Bearer <token>`; a wrong or
        missing token yields `401`, and when no token is configured the route is
        disabled and answers `503`.

  # ---------------------------------------------------------------------------
  # Shared parameters
  # ---------------------------------------------------------------------------
  parameters:

    # TLE
    GroupParam: { name: group, in: query, description: 'Which upstream group to merge; `all` merges every source and de-duplicates by NORAD id, keeping the newest epoch.', schema: { type: string, enum: [all, weather, amateur, amsat, satnogs], default: all }, example: all }
    SourceParam: { name: source, in: path, required: true, description: 'Single upstream document: `weather` (CelesTrak Weather), `amateur` (CelesTrak Amateur), `amsat` or `satnogs`.', schema: { type: string, enum: [weather, amateur, amsat, satnogs] }, example: amateur }
    FormatParam: { name: format, in: query, description: '`tle` (default) returns classical 20-column TLE text, three lines per satellite with a `#` comment header; `json` returns the envelope whose data is an array of TleRecord.', schema: { type: string, enum: [tle, json], default: tle }, example: tle }
    NoradParam: { name: norad, in: query, description: 'Comma separated NORAD catalogue numbers to keep.', schema: { type: [string, "null"] }, example: '25544,43017' }
    LimitParam: { name: limit, in: query, description: 'Maximum number of satellites to return; `0` means all.', schema: { type: integer, minimum: 0, maximum: 20000, default: 0 }, example: 500 }
    MetaParam: { name: meta, in: query, description: 'Alias of `include_meta`; `false` removes the leading `#` comment block from the text output.', schema: { type: boolean, default: true }, example: true }
    IncludeMetaParam: { name: include_meta, in: query, description: 'Alias of `meta`; `false` removes the leading `#` comment block from the text output.', schema: { type: boolean, default: true }, example: true }
    PrettyParam: { name: pretty, in: query, description: 'Pretty-print the JSON output.', schema: { type: boolean, default: false }, example: true }

    # Pagination and projection
    PageParam: { name: page, in: query, description: '1-based page number.', schema: { type: integer, minimum: 1, default: 1 }, example: 1 }
    PerPageParam: { name: per_page, in: query, description: 'Page size, maximum 1000.', schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }, example: 100 }
    AllParam: { name: all, in: query, description: 'Return the whole list and ignore pagination. Use with care on `/v1/transmitters`, whose upstream document is about 4 MB.', schema: { type: boolean, default: false }, example: false }
    FieldsParam: { name: fields, in: query, description: 'Comma separated projection applied server-side. The default set is endpoint specific; `fields=all` returns every upstream field unchanged.', schema: { type: string }, example: 'norad_cat_id,name,status,updated' }
    SinceParam: { name: since, in: query, description: 'Only return records changed or observed at or after this instant (ISO-8601 timestamp or unix seconds).', schema: { type: [string, integer] }, example: '2024-06-01T00:00:00Z' }
    UntilParam: { name: until, in: query, description: 'Only return records changed or observed at or before this instant (ISO-8601 timestamp or unix seconds).', schema: { type: [string, integer] }, example: '2024-06-01T23:59:59Z' }
    SortParam: { name: sort, in: query, description: 'Upstream field name to sort by.', schema: { type: string }, example: norad_cat_id }
    OrderParam: { name: order, in: query, description: 'Sort direction.', schema: { type: string, enum: [asc, desc], default: asc }, example: asc }

    # Satellites
    NoradCatIdParam: { name: norad_cat_id, in: query, description: 'Comma separated NORAD catalogue numbers.', schema: { type: [string, integer] }, example: '25544,43017' }
    SatIdParam: { name: sat_id, in: query, description: 'Comma separated SatNOGS satellite identifiers.', schema: { type: [string, "null"] }, example: 'SCHX-0895-2361-9925-0309' }
    SatelliteStatusParam: { name: status, in: query, description: 'Satellite status as published by SatNOGS, for example `in orbit`.', schema: { type: string }, example: in orbit }
    OperatorParam: { name: operator, in: query, description: 'Operator name as published by SatNOGS.', schema: { type: string }, example: NASA }
    SatelliteSearchParam: { name: search, in: query, description: 'Case-insensitive free-text match against `name`, `names`, `operator`, `countries` and `sat_id`.', schema: { type: string }, example: 'space station' }

    # Transmitters
    UuidParam: { name: uuid, in: query, description: 'Comma separated transmitter UUIDs.', schema: { type: [string, "null"] }, example: 'aaaabbbb-1111-2222-3333-444455556666' }
    ModeParam: { name: mode, in: query, description: 'Comma separated transmitter modes, for example `FM`, `BPSK`, `CW`.', schema: { type: [string, "null"] }, example: 'FM,AFSK' }
    TransmitterStatusParam: { name: status, in: query, description: 'Transmitter status as published by SatNOGS.', schema: { type: string }, example: active }
    TypeParam: { name: type, in: query, description: 'Comma separated transmitter types, for example `Transmitter`, `Transponder`.', schema: { type: [string, "null"] }, example: Transponder }
    AliveParam: { name: alive, in: query, description: 'Only return transmitters whose upstream `alive` flag matches.', schema: { type: boolean }, example: true }
    TransmitterSearchParam: { name: search, in: query, description: 'Case-insensitive free-text match against `description`, `mode`, `type` and `uuid`.', schema: { type: string }, example: 'voice repeater' }

    # AMSAT
    AmsatSatelliteParam: { name: satellite, in: query, description: 'Comma separated satellite names.', schema: { type: [string, "null"] }, example: 'AO-7,AO-91' }
    CallsignParam: { name: callsign, in: query, description: 'Comma separated amateur radio callsigns.', schema: { type: [string, "null"] }, example: 'VK2ABC,N0CALL' }
    AmsatStatusParam: { name: status, in: query, description: 'Comma separated report statuses, for example `Heard` or `Not Heard`.', schema: { type: [string, "null"] }, example: Heard }

    # System
    UiParam: { name: ui, in: query, description: '`1` or `true` renders the HTML dashboard instead of the JSON health document; the payload equals `/v1/status`.', schema: { type: boolean, default: false }, example: true }

  # ---------------------------------------------------------------------------
  # Shared headers
  # ---------------------------------------------------------------------------
  headers:

    ETag: { description: 'Strong entity tag of the served document; send it back with `If-None-Match`.', schema: { type: string }, example: '"6f4a1c9e2b7d8f30"' }
    LastModified: { description: 'RFC 7231 HTTP-date of the last successful upstream refresh.', schema: { type: string }, example: 'Sat, 01 Jun 2024 12:00:00 GMT' }
    CacheControl: { description: 'Freshness policy applied by the service; `no-store` for live health probes.', schema: { type: string }, example: 'public, max-age=3600, stale-while-revalidate=600' }
    XCacheStatus: { description: 'Cache disposition of this response.', schema: { type: string, enum: [HIT, MISS, STALE] }, example: HIT }
    XCacheAge: { description: 'Age of the served cached document, in seconds.', schema: { type: integer, minimum: 0 }, example: 212 }
    XCacheTTL: { description: 'Freshness window of the served cached document, in seconds.', schema: { type: integer, minimum: 0 }, example: 3600 }
    XCacheBackend: { description: 'Storage backend that served the cached document.', schema: { type: string, enum: [redis, file, memory, none] }, example: redis }
    XRequestId: { description: 'Unique id of this request, repeated in `meta.request_id` and in problem documents.', schema: { type: string }, example: 'req_43492d7eec89ee04' }
    XServiceVersion: { description: 'Running service version.', schema: { type: string }, example: 3.1.2789-beta }
    XHealth: { description: 'Aggregate health of the service: `ok`, `degraded` or `critical`. Sent on `/v1/health`, `/v1/health/ready` and `/v1/status`.', schema: { type: string, enum: [ok, degraded, critical] }, example: ok }
    RetryAfter: { description: 'Seconds to wait before the request may be retried.', schema: { type: integer, minimum: 0 }, example: 30 }
    XRateLimitLimit: { description: 'Request budget of the current window.', schema: { type: integer, minimum: 0 }, example: 600 }
    XRateLimitRemaining: { description: 'Requests left in the current window.', schema: { type: integer, minimum: 0 }, example: 597 }
    XRateLimitReset: { description: 'Unix timestamp at which the current window resets.', schema: { type: integer }, example: 1717243200 }
    Deprecation: { description: 'RFC 8594 deprecation marker: `true`, or the date at which the route was deprecated.', schema: { type: string }, example: 'true' }
    Sunset: { description: 'RFC 8594 removal date of the deprecated route, when one is scheduled.', schema: { type: string }, example: 'Fri, 01 Jan 2027 00:00:00 GMT' }
    Link: { description: 'RFC 8288 links: `next`, `prev` and `last` on paginated responses; `rel="successor-version"` on deprecated routes.', schema: { type: string }, example: '</v1/satellites?page=2&per_page=100>; rel="next", </v1/satellites?page=26&per_page=100>; rel="last"' }
    LinkSuccessorVersion: { description: 'Link to the `/v1` resource that replaces this deprecated route.', schema: { type: string }, example: '</v1/tle>; rel="successor-version"' }

  # ---------------------------------------------------------------------------
  # Shared responses
  # ---------------------------------------------------------------------------
  responses:

    NotModified:
      description: 'The cached representation still matches the `If-None-Match` entity tag; no body is returned.'
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Cache-Status: { $ref: '#/components/headers/XCacheStatus' }
        X-Cache-Age: { $ref: '#/components/headers/XCacheAge' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }

    BadRequest:
      description: 'One or more query parameters are invalid (`bad_request`).'
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            invalidEnum: { $ref: '#/components/examples/ProblemBadRequest' }

    NotFound:
      description: 'The requested resource does not exist: unknown path, unsupported `{source}` value or unknown identifier (`not_found`).'
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            unknownSource: { $ref: '#/components/examples/ProblemNotFound' }

    MethodNotAllowed:
      description: 'The HTTP method is not supported for this path (`method_not_allowed`).'
      headers:
        Allow: { description: 'Methods allowed for this path.', schema: { type: string }, example: 'GET, HEAD, OPTIONS' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            wrongMethod: { $ref: '#/components/examples/ProblemMethodNotAllowed' }

    Unauthorized:
      description: 'The administrator bearer token is missing or wrong (`unauthorized`).'
      headers:
        WWW-Authenticate: { description: 'Authentication challenge.', schema: { type: string }, example: 'Bearer realm="satellite-api-admin"' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            missingToken: { $ref: '#/components/examples/ProblemUnauthorized' }

    PayloadTooLarge:
      description: 'The request body exceeds the accepted size (`payload_too_large`).'
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            tooLarge: { $ref: '#/components/examples/ProblemPayloadTooLarge' }

    RateLimited:
      description: 'The client exceeded its request budget (`rate_limited`).'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            throttled: { $ref: '#/components/examples/ProblemRateLimited' }

    ServiceUnavailable:
      description: 'Data cannot be produced right now: the endpoint is in maintenance (`maintenance`) or every relevant upstream is unreachable (`upstream_unavailable`).'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            maintenance: { $ref: '#/components/examples/ProblemMaintenance' }
            upstreamDown: { $ref: '#/components/examples/ProblemUpstreamUnavailable' }

    AdminDisabled:
      description: 'The administrator API is disabled because no token is configured (`unauthorized`).'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            disabled: { $ref: '#/components/examples/ProblemAdminDisabled' }

    InternalServerError:
      description: 'An unexpected server-side failure (`internal_error`).'
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            failure: { $ref: '#/components/examples/ProblemInternalError' }

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:

    # --- Envelope ------------------------------------------------------------
    Envelope:
      type: object
      description: Common JSON response envelope; concrete envelopes narrow `data` to the endpoint payload.
      required: [meta, data]
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        data: { description: 'Payload of the endpoint; narrowed by each concrete envelope.' }

    Meta:
      type: object
      description: Response metadata present on every JSON response.
      required: [service, version, api_version, generated, request_id, elapsed_ms]
      properties:
        service: { type: string, description: Service name., example: AzureOpenAPI for Satellite }
        version: { type: string, description: Service version., example: 3.1.2789-beta }
        api_version: { type: string, description: Public API version prefix., example: v1 }
        generated: { type: string, description: RFC 3339 UTC generation time., example: '2026-09-20T05:57:45Z' }
        request_id: { type: string, description: Unique id of this request., example: 'req_43492d7eec89ee04' }
        elapsed_ms: { type: number, description: Server-side handling time in milliseconds., example: 214 }
        count: { type: integer, minimum: 0, description: Number of items returned., example: 100 }
        total: { type: integer, minimum: 0, description: Number of items available before pagination., example: 2547 }
        fields: { type: [array, string], items: { type: string }, description: 'Projection applied to the data rows: an array of field names, or `all` when every upstream field is returned.', example: [sat_id, norad_cat_id, name, status, updated] }
        sources: { type: array, items: { $ref: '#/components/schemas/SourceStatus' }, description: 'Per-upstream outcome; only set by the merged TLE feed.', example: [{ id: weather, label: CelesTrak Weather, count: 3, ok: true, cache: HIT, age_seconds: 1, error: null }] }
        source: { $ref: '#/components/schemas/MetaSource' }
        cache: { $ref: '#/components/schemas/CacheInfo' }
        pagination: { $ref: '#/components/schemas/Pagination' }
        warnings: { type: array, items: { type: string }, description: Non-fatal notes such as a stale upstream document., example: ['amsat: serving stale document (age 4200s > ttl 3600s)'] }
        writable: { type: boolean, description: 'Whether admin maintenance writes are enabled; only set by `/v1/maintenance`.', example: false }
        hint: { type: string, description: 'Operator hint about the maintenance API; only set by `/v1/maintenance`.', example: 'Maintenance writes are disabled: set SATAPI_ADMIN_TOKEN (config admin.token) to enable them.' }
        applied_by: { type: string, description: 'Client address that applied a maintenance change; only set by the `POST /v1/maintenance` response.', example: '203.0.113.7' }
        license: { type: string, description: 'Attribution notice; only set by the merged TLE feed.', example: 'Upstream data: see /v1/meta#attribution' }

    CacheInfo:
      type: object
      description: Cache disposition of the served document.
      required: [status]
      properties:
        status: { type: string, enum: [HIT, MISS, STALE], description: Matches the X-Cache-Status header., example: HIT }
        age_seconds: { type: [integer, "null"], minimum: 0, description: Age of the cached document in seconds., example: 212 }
        ttl: { type: [integer, "null"], minimum: 0, description: Freshness window in seconds., example: 3600 }

    Pagination:
      type: object
      description: Pagination state; omitted by endpoints that never paginate.
      required: [page, per_page, total, total_pages, has_more]
      properties:
        page: { type: integer, minimum: 1, example: 1 }
        per_page: { type: integer, minimum: 1, maximum: 1000, example: 100 }
        total: { type: integer, minimum: 0, example: 2547 }
        total_pages: { type: integer, minimum: 0, example: 26 }
        has_more: { type: boolean, example: true }
        next: { type: [string, "null"], description: URL of the next page or null on the last page., example: '/v1/satellites?page=2&per_page=100' }

    SourceStatus:
      type: object
      description: Outcome of one upstream while a merged TLE response was assembled.
      required: [id, label, count, ok, cache, age_seconds, error]
      properties:
        id: { type: string, description: Upstream id., example: weather }
        label: { type: string, description: Human-readable upstream name., example: CelesTrak Weather }
        count: { type: integer, minimum: 0, description: Records this upstream contributed., example: 3 }
        ok: { type: boolean, description: Whether the upstream answered., example: true }
        cache: { type: string, enum: [HIT, MISS, STALE, EXPIRED], description: Cache disposition of the upstream document., example: HIT }
        age_seconds: { type: integer, minimum: 0, description: Age of the cached upstream document in seconds., example: 1 }
        error: { type: [string, "null"], description: Failure message when `ok` is false., example: null }

    MetaSource:
      type: object
      description: The single upstream an endpoint reads, as recorded in `meta.source`.
      required: [id, label, url, attribution, cache, age_seconds, ttl]
      properties:
        id: { type: string, description: Upstream id., example: satnogs_satellites }
        label: { type: string, description: Human-readable upstream name., example: SatNOGS Satellites }
        url: { type: string, description: Upstream document URL., example: 'https://db.satnogs.org/api/satellites/' }
        attribution: { type: string, description: Attribution string for the upstream., example: 'SatNOGS DB (libre.space)' }
        cache: { type: string, enum: [HIT, MISS, STALE, EXPIRED], description: Cache disposition of the upstream document., example: HIT }
        age_seconds: { type: integer, minimum: 0, description: Age of the cached upstream document in seconds., example: 3 }
        ttl: { type: integer, minimum: 0, description: Freshness window of the upstream document in seconds., example: 21600 }

    ServiceLinks:
      type: object
      description: Canonical links published by the service.
      properties:
        self: { type: string, example: /v1/meta }
        docs: { type: string, example: /docs.html }
        openapi: { type: string, example: /openapi.yaml }
        status: { type: string, example: /v1/status }
        health: { type: string, example: /v1/health }
        ready: { type: string, example: /v1/health/ready }
        sources: { type: string, description: Templated per-source TLE feed., example: '/v1/tle/{source}' }

    # --- TLE -----------------------------------------------------------------
    TleRecord:
      type: object
      description: One two-line element set after normalisation.
      required: [norad_id, name, epoch, epoch_unix, source, tle, checksum_ok]
      properties:
        norad_id: { type: string, pattern: '^[0-9]{5}$', description: 'NORAD catalogue number, zero padded to five characters.', example: '25544' }
        name: { type: string, description: Satellite name as published upstream., example: ISS (ZARYA) }
        epoch: { type: string, description: RFC 3339 UTC epoch of the element set., example: '2026-09-27T12:00:00Z' }
        epoch_unix: { type: integer, description: Same instant as unix seconds., example: 1790510400 }
        source: { type: string, enum: [weather, amateur, amsat, satnogs], description: Upstream that contributed this element set., example: satnogs }
        tle: { type: array, minItems: 2, maxItems: 2, items: { type: string }, description: 'The two element lines, line 1 first.', example: ['1 25544U 98067A   26270.50000000  .00006292  00000-0  12172-3 0  9997', '2 25544  51.6310 211.2092 0004923 144.3133 215.8185 15.49128922585812'] }
        checksum_ok: { type: boolean, description: Whether both element lines pass the modulo-10 TLE checksum., example: true }

    TleEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/TleRecord' } }

    # --- Catalogue -----------------------------------------------------------
    Satellite:
      type: object
      description: 'SatNOGS satellite object. The default projection returns the members listed here; `fields=all` returns every upstream member, including ones this schema does not name.'
      required: [sat_id, norad_cat_id, name]
      properties:
        sat_id: { type: string, description: SatNOGS satellite identifier., example: 'SCHX-0895-2361-9925-0309' }
        norad_cat_id: { type: integer, minimum: 1, example: 965 }
        name: { type: string, example: TRANSIT 5B-5 }
        names: { type: string, description: 'Alternative names, comma separated as published upstream.', example: 'OPS 6582' }
        status: { type: string, description: Upstream satellite status., example: in orbit }
        launched: { type: [string, "null"], description: RFC 3339 UTC launch instant as published upstream., example: '1964-12-13T00:00:00Z' }
        operator: { type: [string, "null"], example: NASA }
        countries: { type: [string, "null"], description: 'Country codes as published upstream, comma separated.', example: US }
        updated: { type: string, description: RFC 3339 UTC timestamp of the last upstream change., example: '2024-09-16T18:41:03.363197Z' }
        image: { type: [string, "null"], description: 'Relative image path; present only in the complete upstream document (`fields=all` or the legacy route).', example: 'satellites/transit-o__1.jpg' }
        citation: { type: [string, "null"], description: 'Citation URL; present only in the complete upstream document (`fields=all` or the legacy route).', example: 'https://secwww.jhuapl.edu/techdigest/' }

    SatelliteEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/Satellite' } }

    Transmitter:
      type: object
      description: 'SatNOGS transmitter object. The default projection returns the members listed here; `fields=all` returns every upstream member.'
      required: [uuid, norad_cat_id]
      properties:
        uuid: { type: string, description: Transmitter UUID., example: 'aaaabbbb-1111-2222-3333-444455556666' }
        norad_cat_id: { type: integer, minimum: 1, example: 25544 }
        description: { type: [string, "null"], example: 'ISS APRS digipeater' }
        mode: { type: [string, "null"], description: Modulation or mode label., example: AFSK }
        baud: { type: [integer, "null"], minimum: 0, description: Baud rate when applicable; `0` when the upstream reports none., example: 1200 }
        type: { type: [string, "null"], description: Transmitter type., example: Transmitter }
        status: { type: [string, "null"], description: Upstream transmitter status., example: active }
        alive: { type: boolean, description: Upstream liveness flag., example: true }
        uplink_low: { type: [integer, "null"], description: Uplink frequency in Hz., example: 145825000 }
        downlink_low: { type: [integer, "null"], description: Downlink frequency in Hz., example: 145825000 }
        updated: { type: string, description: RFC 3339 UTC timestamp of the last upstream change., example: '2026-09-10T12:00:00.000000Z' }

    TransmitterEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/Transmitter' } }

    # --- AMSAT ---------------------------------------------------------------
    AmsatReport:
      type: object
      description: One AMSAT live status report.
      required: [status, callsign, grid, satellite, norad_id, timestamp, timestamp_unix]
      properties:
        status: { type: string, description: Report status such as `Heard` or `Not Heard`., example: Heard }
        callsign: { type: string, example: VK2ABC }
        grid: { type: [string, "null"], description: Maidenhead grid locator of the reporting station., example: QF56 }
        satellite: { type: string, example: AO-7 }
        norad_id: { type: [string, "null"], description: 'NORAD catalogue number, zero padded to five characters.', example: '07530' }
        timestamp: { type: string, description: RFC 3339 UTC timestamp of the report., example: '2026-09-15T13:05:00Z' }
        timestamp_unix: { type: integer, description: Same instant as unix seconds., example: 1789477500 }

    AmsatEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/AmsatReport' } }

    LegacyAmsatReport:
      type: object
      description: 'Pre-v1 AMSAT report; timestamps use the PHP `"Y-m-d H:i:s"` format in UTC.'
      required: [status, callsign, satellite, timestamp]
      properties:
        status: { type: string, example: Heard }
        callsign: { type: string, example: VK2ABC }
        grid: { type: [string, "null"], example: QF56 }
        satellite: { type: string, example: AO-7 }
        norad_id: { type: [string, "null"], description: 'NORAD catalogue number, zero padded to five characters.', example: '07530' }
        timestamp: { type: string, description: 'UTC timestamp formatted as "Y-m-d H:i:s".', example: '2026-09-15 13:05:00' }

    LegacyAmsatEnvelope:
      type: object
      description: Historical pre-v1 AMSAT status envelope.
      required: [status, generated, total_reports, data]
      properties:
        status: { type: string, example: success }
        generated: { type: string, description: 'UTC generation time formatted as "Y-m-d H:i:s" followed by " UTC".', example: '2026-09-20 05:57:58 UTC' }
        total_reports: { type: integer, minimum: 0, example: 4 }
        data: { type: array, items: { $ref: '#/components/schemas/LegacyAmsatReport' } }

    # --- Service metadata ----------------------------------------------------
    EndpointDescriptor:
      type: object
      description: 'One public route as advertised by `/v1/meta`.'
      required: [path, methods, id]
      properties:
        path: { type: string, description: 'Route path, with `{source}` left as a template.', example: /v1/tle }
        methods: { type: array, items: { type: string }, description: HTTP methods served on this path., example: [GET, HEAD] }
        id: { type: string, description: Maintenance endpoint id., example: tle_merge }

    SourceDescriptor:
      type: object
      description: One upstream data source.
      required: [id, label, url, cache_ttl, parser, attribution]
      properties:
        id: { type: string, example: weather }
        label: { type: string, example: CelesTrak Weather }
        url: { type: string, example: 'https://celestrak.org/NORAD/elements/gp.php?GROUP=weather&FORMAT=tle' }
        cache_ttl: { type: integer, minimum: 0, description: Cache freshness window in seconds., example: 10800 }
        parser: { type: string, description: Parser applied to the upstream document., example: tle-text }
        attribution: { type: string, example: 'CelesTrak (Dr. T.S. Kelso)' }

    LimitsDocument:
      type: object
      description: Limits enforced by the service.
      required: [rate_limit_enabled, rate_limit_per_minute, max_per_page, compression, max_request_bytes]
      properties:
        rate_limit_enabled: { type: boolean, description: 'Whether the per-client request budget is enforced.', example: false }
        rate_limit_per_minute: { type: integer, minimum: 0, description: Configured request budget per minute when rate limiting is enabled., example: 120 }
        max_per_page: { type: integer, minimum: 1, description: Largest accepted `per_page` value., example: 1000 }
        compression: { type: boolean, description: Whether response compression is enabled., example: true }
        max_request_bytes: { type: integer, minimum: 0, description: Largest accepted request body in bytes., example: 33554432 }

    RateLimitInfo:
      type: object
      description: Rate limit description carried by a `rate_limited` problem document.
      required: [limit, remaining, reset]
      properties:
        limit: { type: integer, minimum: 0, description: Request budget of the window., example: 600 }
        remaining: { type: integer, minimum: 0, example: 597 }
        reset: { type: integer, description: Unix timestamp at which the window resets., example: 1717243200 }
        window_seconds: { type: [integer, "null"], description: Length of the window in seconds., example: 60 }

    ErrorDescriptor:
      type: object
      description: 'Catalogue of every problem code the service can emit, mapping the `code` to a human-readable description.'
      additionalProperties: { type: string }
      example: { bad_request: 'Malformed or contradictory query parameters.', not_found: 'Unknown route or unknown resource identifier.' }

    ServiceInfo:
      type: object
      description: 'Build and contact information of the running service.'
      required: [name, version, api_version, description, homepage, docs, openapi, status_page, license, contact, build]
      properties:
        name: { type: string, example: AzureOpenAPI for Satellite }
        version: { type: string, example: 3.1.2789-beta }
        api_version: { type: string, example: v1 }
        description: { type: string, example: 'Unified TLE and satellite metadata proxy (CelesTrak, AMSAT, SatNOGS).' }
        homepage: { type: string, example: 'https://satellite.api.authskin.xyz' }
        docs: { type: string, example: /docs.html }
        openapi: { type: string, example: /openapi.yaml }
        status_page: { type: string, example: /v1/status }
        license: { type: string, example: 'Data: public sources. API code: MIT.' }
        contact: { type: string, example: 'https://community.libre.space/' }
        build: { type: string, description: Build identifier of the running deployment., example: local }

    MetaDocument:
      type: object
      description: 'The `/v1/meta` payload.'
      required: [service, endpoints, legacy_routes, sources, limits, errors, cache_backend, maintenance, links]
      properties:
        service: { $ref: '#/components/schemas/ServiceInfo' }
        endpoints: { type: array, items: { $ref: '#/components/schemas/EndpointDescriptor' } }
        legacy_routes: { type: array, items: { type: string }, description: Ids of the deprecated pre-v1 routes., example: [tle_merge, tle_weather, amsat_status, health] }
        sources: { type: array, items: { $ref: '#/components/schemas/SourceDescriptor' } }
        limits: { $ref: '#/components/schemas/LimitsDocument' }
        errors: { $ref: '#/components/schemas/ErrorDescriptor' }
        cache_backend: { type: string, description: Active cache backend., example: file }
        maintenance: { $ref: '#/components/schemas/MaintenanceMap' }
        links: { $ref: '#/components/schemas/ServiceLinks' }

    MetaEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/MetaDocument' }

    # --- Maintenance ---------------------------------------------------------
    MaintenanceState:
      type: object
      description: Maintenance state of one endpoint.
      required: [endpoint, enabled, message, source]
      properties:
        endpoint: { type: string, description: Endpoint id., example: tle_weather }
        enabled: { type: boolean, description: Whether the endpoint is in maintenance., example: false }
        message: { type: string, description: Message shown in the maintenance problem document; empty when no window is active., example: '' }
        source: { type: string, description: 'Where the active state is stored: `redis` or `file`; empty string when the endpoint is not in maintenance.', example: '' }

    MaintenanceMap:
      type: object
      description: Maintenance states keyed by endpoint id.
      additionalProperties: { $ref: '#/components/schemas/MaintenanceState' }

    MaintenanceEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/MaintenanceState' } }

    MaintenanceUpdate:
      type: object
      description: 'Request body of `POST /v1/maintenance`.'
      required: [endpoint]
      properties:
        endpoint: { type: string, description: 'Endpoint id, or `all` for every endpoint.', example: tle_weather }
        enabled: { type: boolean, default: true, description: 'Enable (`true`) or clear (`false`) maintenance.', example: true }
        message: { type: string, description: Message returned to clients while maintenance is active., example: 'Planned CelesTrak upstream rework; try again in an hour.' }
        ttl: { type: integer, minimum: 60, maximum: 86400, default: 3600, description: Lifetime of the state in seconds., example: 3600 }

    MaintenanceApplyResult:
      type: object
      description: Result of applying a maintenance state.
      required: [endpoints, enabled, ttl, until, state]
      properties:
        endpoints: { type: array, items: { type: string }, description: Endpoint ids the state was applied to., example: [tle_weather] }
        enabled: { type: boolean, description: Whether maintenance was enabled (`true`) or cleared (`false`)., example: true }
        ttl: { type: integer, minimum: 60, maximum: 86400, description: Lifetime of the applied state in seconds., example: 3600 }
        until: { type: [string, "null"], description: 'RFC 3339 UTC instant the state lapses, or null when maintenance was cleared.', example: '2026-09-20T06:57:53Z' }
        state: { type: array, items: { $ref: '#/components/schemas/MaintenanceState' }, description: Maintenance state of every endpoint after the change. }

    MaintenanceApplyEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/MaintenanceApplyResult' }

    # --- Problems ------------------------------------------------------------
    ProblemCode:
      type: string
      description: Stable machine-readable error code.
      enum: [bad_request, not_found, method_not_allowed, maintenance, upstream_unavailable, rate_limited, payload_too_large, unauthorized, internal_error]

    ProblemMaintenance:
      type: object
      description: Maintenance context of a `maintenance` problem.
      required: [endpoint]
      properties:
        endpoint: { type: string, example: tle_weather }
        retry_after: { type: [integer, "null"], description: Seconds until the endpoint is expected back., example: 120 }
        until: { type: [string, "null"], description: 'RFC 3339 UTC instant the window is expected to end, or null when no end is scheduled.', example: null }

    Problem:
      type: object
      description: 'RFC 9457 problem details document, served as `application/problem+json`.'
      required: [type, title, status, detail, code, instance, request_id]
      properties:
        type: { type: string, description: URI reference identifying the problem type., example: 'https://satellite.api.authskin.xyz/errors/not-found' }
        title: { type: string, description: Short human-readable summary., example: Not Found }
        status: { type: integer, minimum: 100, maximum: 599, example: 404 }
        detail: { type: string, description: Human-readable explanation of this occurrence., example: 'No route matches /v1/nope. See /v1/meta for the endpoint index.' }
        code: { $ref: '#/components/schemas/ProblemCode' }
        instance: { type: string, description: URI reference of the request that failed., example: /v1/nope }
        request_id: { type: string, example: 'req_990c37cbed355be3' }
        sources: { type: array, items: { $ref: '#/components/schemas/SourceStatus' }, description: Per-upstream outcome when no data could be assembled (`upstream_unavailable`)., example: [{ id: weather, label: CelesTrak Weather, count: 0, ok: false, cache: EXPIRED, age_seconds: 0, error: 'the PHP cURL extension is not installed' }] }
        parameter: { type: [string, "null"], description: Query parameter that caused the problem when applicable., example: format }
        allow: { type: array, items: { type: string }, description: Methods allowed for the path (`method_not_allowed`)., example: [GET, HEAD, OPTIONS] }
        maintenance: { $ref: '#/components/schemas/ProblemMaintenance' }
        hint: { type: string, description: Operator hint about how to resolve or interpret the condition (`upstream_unavailable`)., example: 'Cached data is served automatically whenever it exists; this response means even the stale copy was unavailable.' }
        rate_limit: { $ref: '#/components/schemas/RateLimitInfo' }

    # --- Health --------------------------------------------------------------
    RedisCheck:
      type: string
      description: Redis availability as seen by the health check.
      enum: [connected, extension_not_loaded, connection_failed]

    StorageCheck:
      type: object
      description: Cache storage backend state.
      required: [backend, cache_dir, cache_dir_writable, redis_ext]
      properties:
        backend: { type: string, description: Active cache backend., example: file }
        cache_dir: { type: string, description: Absolute path of the cache directory., example: /app/tests/tmp/cache }
        cache_dir_writable: { type: boolean, example: true }
        redis_ext: { type: boolean, description: Whether the Redis PHP extension is loaded., example: false }

    CacheFileState:
      type: object
      description: State of one tracked cache document.
      required: [exists, fresh]
      properties:
        exists: { type: boolean, example: true }
        age_seconds: { type: [integer, "null"], minimum: 0, example: 750 }
        age_human: { type: [string, "null"], description: Human-readable age., example: '12m 30s' }
        size: { type: [integer, "null"], minimum: 0, description: Size in bytes., example: 184320 }
        fresh: { type: boolean, description: Whether the document is inside its TTL., example: true }
        ttl: { type: [integer, "null"], minimum: 0, example: 7200 }
        backend: { type: [string, "null"], example: file }
        sources: { type: [integer, "null"], minimum: 0, description: 'Number of contributing per-source TLE documents; only set on the `tle_merge` aggregate entry.' }

    CacheFileMap:
      type: object
      description: Cache documents keyed by name (for example `tle_weather` or `satnogs_transmitters`).
      additionalProperties: { $ref: '#/components/schemas/CacheFileState' }

    HealthChecks:
      type: object
      description: Subsystem checks.
      required: [redis, storage, cache_files, maintenance]
      properties:
        redis: { $ref: '#/components/schemas/RedisCheck' }
        storage: { $ref: '#/components/schemas/StorageCheck' }
        cache_files: { $ref: '#/components/schemas/CacheFileMap' }
        maintenance: { $ref: '#/components/schemas/MaintenanceMap' }

    MetricCounters:
      type: object
      description: Aggregate request counters.
      required: [requests, errors, avg_ms, bytes]
      properties:
        requests: { type: integer, minimum: 0, example: 18422 }
        errors: { type: integer, minimum: 0, example: 37 }
        avg_ms: { type: number, example: 38.4 }
        bytes: { type: integer, minimum: 0, description: Response bytes served., example: 92045122 }

    EndpointMetrics:
      type: object
      description: Per-endpoint request counters.
      required: [requests, errors, avg_ms, cache, last_status, last_seen_at]
      properties:
        requests: { type: integer, minimum: 0, example: 9120 }
        errors: { type: integer, minimum: 0, example: 12 }
        avg_ms: { type: number, example: 44.6 }
        cache: { type: object, description: 'Cache dispositions seen for this endpoint, keyed by status.', additionalProperties: { type: integer, minimum: 0 }, example: { HIT: 9080, MISS: 40 } }
        last_status: { type: integer, minimum: 100, maximum: 599, description: HTTP status of the most recent request., example: 200 }
        last_seen_at: { type: integer, minimum: 0, description: Unix timestamp of the most recent request., example: 1717243200 }

    UpstreamMetrics:
      type: object
      description: Per-upstream fetch counters.
      required: [ok, fail, last_ms, last_ok_at, last_fail_at, last_error]
      properties:
        ok: { type: integer, minimum: 0, description: Successful fetches., example: 412 }
        fail: { type: integer, minimum: 0, description: Failed fetches., example: 3 }
        last_ms: { type: integer, minimum: 0, description: Duration of the most recent fetch in milliseconds., example: 241 }
        last_ok_at: { type: integer, minimum: 0, description: Unix timestamp of the last successful fetch., example: 1717243181 }
        last_fail_at: { type: integer, minimum: 0, description: Unix timestamp of the last failed fetch., example: 1717233123 }
        last_error: { type: [string, "null"], description: Message of the last upstream failure., example: 'the PHP cURL extension is not installed' }

    HealthMetrics:
      type: object
      description: Runtime metrics.
      required: [totals, endpoints, upstream]
      properties:
        totals: { $ref: '#/components/schemas/MetricCounters' }
        endpoints:
          description: 'Counters keyed by endpoint id; an empty map is serialised as `[]` until the first request is recorded.'
          type: [object, array]
          additionalProperties: { $ref: '#/components/schemas/EndpointMetrics' }
        upstream:
          description: 'Counters keyed by upstream source id; an empty map is serialised as `[]` until the first fetch is recorded.'
          type: [object, array]
          additionalProperties: { $ref: '#/components/schemas/UpstreamMetrics' }

    HealthDocument:
      type: object
      description: 'Aggregate health document returned by `/v1/health` and `/health`.'
      required: [status, overall, timestamp, generated, service, version, api_version, uptime_seconds, checks, metrics]
      properties:
        status: { type: string, enum: [ok, degraded], description: Coarse service status., example: ok }
        overall: { type: string, enum: [ok, degraded, critical], description: 'Aggregate verdict; `critical` yields HTTP 503.', example: ok }
        timestamp: { type: string, description: 'Check time in UTC, formatted as "Y-m-d H:i:s" followed by " UTC".', example: '2026-09-20 05:57:50 UTC' }
        generated: { type: string, description: RFC 3339 UTC generation time., example: '2026-09-20T05:57:50Z' }
        service: { type: string, description: Service name and version., example: AzureOpenAPI for Satellite v3.1.2789-beta }
        version: { type: string, example: 3.1.2789-beta }
        api_version: { type: string, example: v1 }
        uptime_seconds: { type: number, minimum: 0, example: 864213 }
        checks: { $ref: '#/components/schemas/HealthChecks' }
        metrics: { $ref: '#/components/schemas/HealthMetrics' }

    HealthLive:
      type: object
      description: Liveness probe payload.
      required: [status, check, timestamp, uptime_seconds]
      properties:
        status: { type: string, enum: [ok], example: ok }
        check: { type: string, description: Name of the probe., example: liveness }
        timestamp: { type: string, description: RFC 3339 UTC instant., example: '2026-09-20T05:57:51Z' }
        uptime_seconds: { type: number, minimum: 0, example: 0 }

    HealthReady:
      type: object
      description: Readiness probe payload.
      required: [status, check, timestamp, overall, redis, caches]
      properties:
        status: { type: string, enum: [ok, unavailable], example: ok }
        check: { type: string, description: Name of the probe., example: readiness }
        timestamp: { type: string, description: RFC 3339 UTC instant., example: '2026-09-20T05:57:51Z' }
        overall: { type: string, enum: [ok, degraded, critical], description: Aggregate verdict inherited from the health check., example: ok }
        redis: { $ref: '#/components/schemas/RedisCheck' }
        caches: { type: object, description: Freshness of every tracked cache document., additionalProperties: { type: string, enum: [fresh, stale, missing] } }

