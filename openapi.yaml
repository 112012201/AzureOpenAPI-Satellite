# =============================================================================
# AzureOpenAPI for Satellite - OpenAPI 3.1 description
#
# Rewritten PHP proxy in front of CelesTrak, AMSAT and SatNOGS. Covers the /v1
# API, the system and health endpoints, the admin maintenance API and the
# deprecated pre-v1 surface (whose historical script names such as
# /tle_merge.php, /tle_weather.php and /health.php still resolve).
#
# Docs: /docs.html  |  Status dashboard: /v1/status  |  Health: /v1/health
# =============================================================================
openapi: 3.1.0

info:
  title: AzureOpenAPI for Satellite
  version: 3.3.1+ra
  summary: Unified TLE and satellite metadata proxy.
  description: |
    Unified TLE and satellite metadata proxy (CelesTrak, AMSAT, SatNOGS).

    The service fetches, normalises, merges and caches upstream catalogue
    documents and republishes them over a stable `v1` HTTP surface.
    Documentation: [/docs.html](/docs.html). Status dashboard:
    [/v1/status](/v1/status). Machine-readable health: [/v1/health](/v1/health).

    ## Response envelope

    Every `/v1` JSON response uses one envelope: `{"meta": {...}, "data": ...}`.
    `meta` always carries `service`, `version`, `api_version` (`"v1"`),
    `generated` (RFC 3339 UTC), `request_id` and `elapsed_ms`. Endpoints add the
    extras that apply to them: `count`, `total`, `sources`, `source`, `cache`
    (`status`, `age_seconds`, `ttl`), `pagination` (`page`, `per_page`, `total`,
    `total_pages`, `has_more`, `next`) and `warnings`. Two legacy payloads are
    deliberately flat instead (see the `Legacy` tag).

    ## Problem responses

    Errors are RFC 9457 problem details served as `application/problem+json`.
    Required members: `type`, `title`, `status`, `detail`, `code`, `instance`,
    `request_id`. Optional extras: `sources` (per-upstream outcome),
    `parameter`, `allow`, `hint`, `maintenance`
    (`endpoint`, `retry_after`, `until`) and `rate_limit` (`limit`, `remaining`,
    `reset`).

    Error codes: `bad_request`, `not_found`, `method_not_allowed`,
    `maintenance`, `upstream_unavailable`, `rate_limited`, `payload_too_large`,
    `unauthorized`, `internal_error`.

    ## Headers, caching and limits

    Responses carry `ETag`, `Last-Modified`, `Cache-Control`, `X-Cache-Status`
    (`HIT` | `MISS` | `STALE`), `X-Cache-Age`, `X-Cache-TTL`, `X-Cache-Backend`,
    `X-Request-Id` and `X-Service-Version`. Throttled responses add `Retry-After`
    and `X-RateLimit-Limit` / `X-RateLimit-Remaining` / `X-RateLimit-Reset`;
    paginated responses add `Link`; deprecated routes add `Deprecation`,
    `Sunset` and a `Link` with `rel="successor-version"`.

    Upstream documents are cached server-side (Redis when the extension is
    loaded, otherwise files in the configured cache directory). Send
    `If-None-Match` with a previously returned `ETag` to receive `304 Not
    Modified`; while a document is revalidated the stale copy is still served
    with `X-Cache-Status: STALE`.

    ## Authentication

    All read endpoints are public. Only `POST /v1/maintenance` requires the
    administrator bearer token; when no token is configured that route answers
    `503`.
  contact:
    name: Libre Space Community
    url: https://community.libre.space/
  x-homepage: https://satellite.api.authskin.xyz
  x-documentation: /docs.html
  x-status-page: /v1/status

externalDocs:
  description: Human-readable API documentation
  url: https://satellite.api.authskin.xyz/docs.html

servers:
  - url: https://satellite.api.authskin.xyz
    description: Tencent Cloud EdgeOne accelerated (recommended, stable)
  - url: https://satellite.db.authskin.xyz
    description: |
      SCDN accelerated — **new address, under test**. Same application, same
      routes, same limits; only the edge differs. It is marked `status: new` and
      `testing: true` in `meta.endpoint`, and the browser pages carry a notice
      saying so. Two consequences a client should know:

        * the edge reports its cache verdict in `X-Cache-Status`, a name the origin
          also uses, so the head loses the origin verdict — read
          `X-Origin-Cache-Status` for that;
        * the address may change behaviour without notice while it is being
          characterised.
  - url: https://satellite.authskin.xyz
    description: Direct origin (no CDN; useful for bypassing both edges)

tags:
  - name: TLE
    description: |
      Merged and per-source two-line element sets from CelesTrak Weather,
      CelesTrak Amateur, AMSAT and SatNOGS. The merged feed is de-duplicated by
      NORAD id, keeping the record with the newest epoch.
  - name: Catalogue
    description: |
      SatNOGS satellite and transmitter metadata, paginated and projected
      server-side because the upstream transmitter document is about 4 MB.
  - name: AMSAT
    description: |
      Two AMSAT surfaces, deliberately separate:

      * `/v1/amsat/status` — this service's own report feed, scraped from the
        amsat.org status page and normalised into the `/v1` envelope.
      * `/v1/amsat/{catalog,reports,summary,statuses,health,satellites,sat-info}` —
        a transparent relay of AMSAT's own v1 JSON API at
        https://status.amsat.org/api/v1/. The body is AMSAT's document unchanged,
        so the schemas describe THEIR shapes rather than this service's envelope.
        Reads only: `POST /reports.php` is not proxied.
  - name: System
    description: |
      Service metadata, health, readiness, liveness, the HTML dashboard and the
      per-endpoint maintenance state, plus the privacy/terms acknowledgement
      contract and the proof-of-work exchange the browser entry points use.
  - name: Admin
    description: |
      Operator surface. Not listed in `/v1/meta` and not part of the public
      contract: authenticated by a shared token, and absent (404) on any deployment
      that has not configured one.
  - name: Legacy
    description: |
      Deprecated pre-v1 surface. Every operation here is `deprecated: true` and
      sends a `Link` header with `rel="successor-version"` pointing at its `/v1`
      equivalent. The historical script file names still resolve as well:
      `/tle_merge.php`, `/tle_weather.php`, `/tle_amateur.php`,
      `/tle_amsat.php`, `/tle_satnogs.php`, `/satnogs_satellites_proxy.php`,
      `/satnogs_transmitters_proxy.php`, `/amsat_status_proxy.php`,
      `/health.php`. New clients must use the `/v1` paths.

security: []

paths:

  # ---------------------------------------------------------------------------
  # TLE
  # ---------------------------------------------------------------------------
  /v1/tle:
    get:
      operationId: getMergedTle
      summary: Merged de-duplicated TLE feed
      description: |
        Merged TLE feed built from CelesTrak Weather, CelesTrak Amateur, AMSAT
        and SatNOGS. Records are de-duplicated by NORAD id and the copy with the
        newest epoch wins.

        The default representation is **standard TLE text**: 20-column, three lines
        per satellite (name line, line 1, line 2) preceded by a `#` comment header
        block, which `meta=false` / `include_meta=false` removes. That is what a
        plain browser tab shows.

        JSON is requested explicitly, with `json=true` (the preferred switch) or
        `format=json`; both return the envelope whose `data` is an array of
        `TleRecord`. **The representation depends on the URL alone -- the `Accept`
        header is ignored on this route.** That is deliberate: the edge does not key
        on `Accept` (the response carries `vary: Accept-Encoding` only), so a JSON
        variant warmed by one client used to be served to the next client that asked
        for text at the same URL. Conditional requests are supported
        (`If-None-Match` yields `304`), and while the merged document is rebuilt the
        previous copy is still served with `X-Cache-Status: STALE`.
      tags: [TLE]
      x-endpoint-id: tle_merge
      x-cache-ttl: 3600
      parameters:
        - $ref: '#/components/parameters/GroupParam'
        - $ref: '#/components/parameters/FormatParam'
        - $ref: '#/components/parameters/JsonParam'
        - $ref: '#/components/parameters/NoradParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/MetaParam'
        - $ref: '#/components/parameters/IncludeMetaParam'
        - $ref: '#/components/parameters/PrettyParam'
      responses:
        '200':
          description: Merged feed as TLE text (default) or as a JSON envelope.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Last-Modified: { $ref: '#/components/headers/LastModified' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Cache-Status: { $ref: '#/components/headers/XCacheStatus' }
            X-Cache-Age: { $ref: '#/components/headers/XCacheAge' }
            X-Cache-TTL: { $ref: '#/components/headers/XCacheTTL' }
            X-Cache-Backend: { $ref: '#/components/headers/XCacheBackend' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
          content:
            text/plain:
              schema: { type: string }
              examples:
                merged: { $ref: '#/components/examples/MergedTleText' }
            application/json:
              schema: { $ref: '#/components/schemas/TleEnvelope' }
              examples:
                merged: { $ref: '#/components/examples/MergedTleJson' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/tle/{source}:
    get:
      operationId: getTleBySource
      summary: TLE feed from a single upstream source
      description: |
        Records of exactly one upstream document, without merging or
        de-duplication. The `source` segment selects the upstream and maps to a
        maintenance endpoint id: `weather` -> `tle_weather` (CelesTrak Weather),
        `amateur` -> `tle_amateur` (CelesTrak Amateur), `amsat` -> `tle_amsat`,
        `satnogs` -> `tle_satnogs`. Query parameters are the same as `/v1/tle`
        except `group`, which does not apply. An unsupported `source` yields
        `404`.
      tags: [TLE]
      x-endpoint-ids: [tle_weather, tle_amateur, tle_amsat, tle_satnogs]
      x-cache-ttl: 3600
      parameters:
        - $ref: '#/components/parameters/SourceParam'
        - $ref: '#/components/parameters/FormatParam'
        - $ref: '#/components/parameters/JsonParam'
        - $ref: '#/components/parameters/NoradParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/MetaParam'
        - $ref: '#/components/parameters/IncludeMetaParam'
        - $ref: '#/components/parameters/PrettyParam'
      responses:
        '200':
          description: Records of one upstream document, as TLE text or JSON.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Last-Modified: { $ref: '#/components/headers/LastModified' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Cache-Status: { $ref: '#/components/headers/XCacheStatus' }
            X-Cache-Age: { $ref: '#/components/headers/XCacheAge' }
            X-Cache-TTL: { $ref: '#/components/headers/XCacheTTL' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
          content:
            text/plain:
              schema: { type: string }
              examples:
                amateur: { $ref: '#/components/examples/SingleSourceTleText' }
            application/json:
              schema: { $ref: '#/components/schemas/TleEnvelope' }
              examples:
                amateur: { $ref: '#/components/examples/MergedTleJson' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------------------------------------------------------------------------
  # Catalogue
  # ---------------------------------------------------------------------------
  /v1/satellites:
    get:
      operationId: listSatellites
      summary: SatNOGS satellite metadata
      description: |
        SatNOGS satellite metadata, cached for 6 hours. Data rows mirror the
        upstream SatNOGS satellite object. The projection defaults to
        `sat_id,norad_cat_id,name,names,status,launched,operator,countries,updated`;
        change it with `fields` and use `fields=all` for every upstream field.
        `all=true` returns the whole list and ignores pagination.
      tags: [Catalogue]
      x-endpoint-id: satnogs_satellites
      x-cache-ttl: 21600
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/AllParam'
        - $ref: '#/components/parameters/FieldsParam'
        - $ref: '#/components/parameters/NoradCatIdParam'
        - $ref: '#/components/parameters/SatIdParam'
        - $ref: '#/components/parameters/SatelliteStatusParam'
        - $ref: '#/components/parameters/OperatorParam'
        - $ref: '#/components/parameters/SatelliteSearchParam'
        - $ref: '#/components/parameters/SinceParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
      responses:
        '200':
          description: A page of SatNOGS satellite objects.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Last-Modified: { $ref: '#/components/headers/LastModified' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Cache-Status: { $ref: '#/components/headers/XCacheStatus' }
            X-Cache-Age: { $ref: '#/components/headers/XCacheAge' }
            X-Cache-TTL: { $ref: '#/components/headers/XCacheTTL' }
            Link: { $ref: '#/components/headers/Link' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SatelliteEnvelope' }
              examples:
                firstPage: { $ref: '#/components/examples/SatellitesPage' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/transmitters:
    get:
      operationId: listTransmitters
      summary: SatNOGS transmitter metadata
      description: |
        SatNOGS transmitter metadata, cached for 6 hours. The upstream document
        is about 4 MB, so this endpoint is always paginated and projected. The
        projection defaults to
        `uuid,norad_cat_id,description,mode,baud,type,status,alive,uplink_low,downlink_low,updated`;
        change it with `fields` and use `fields=all` for every upstream field.
        `all=true` ignores pagination.
      tags: [Catalogue]
      x-endpoint-id: satnogs_transmitters
      x-cache-ttl: 21600
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/AllParam'
        - $ref: '#/components/parameters/FieldsParam'
        - $ref: '#/components/parameters/NoradCatIdParam'
        - $ref: '#/components/parameters/UuidParam'
        - $ref: '#/components/parameters/SatIdParam'
        - $ref: '#/components/parameters/ModeParam'
        - $ref: '#/components/parameters/TransmitterStatusParam'
        - $ref: '#/components/parameters/TypeParam'
        - $ref: '#/components/parameters/AliveParam'
        - $ref: '#/components/parameters/TransmitterSearchParam'
        - $ref: '#/components/parameters/SinceParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
      responses:
        '200':
          description: A page of SatNOGS transmitter objects.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Last-Modified: { $ref: '#/components/headers/LastModified' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Cache-Status: { $ref: '#/components/headers/XCacheStatus' }
            X-Cache-Age: { $ref: '#/components/headers/XCacheAge' }
            X-Cache-TTL: { $ref: '#/components/headers/XCacheTTL' }
            Link: { $ref: '#/components/headers/Link' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransmitterEnvelope' }
              examples:
                firstPage: { $ref: '#/components/examples/TransmittersPage' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------------------------------------------------------------------------
  # AMSAT
  # ---------------------------------------------------------------------------
  /v1/amsat/status:
    get:
      operationId: listAmsatStatus
      summary: AMSAT live status reports
      description: |
        AMSAT live status reports, cached for 1 hour. A report records that a
        station heard, or did not hear, a satellite from a grid square.
        Timestamps are normalised to RFC 3339 UTC and also exposed as unix
        seconds in `timestamp_unix`.
      tags: [AMSAT]
      x-endpoint-id: amsat_status
      x-cache-ttl: 3600
      parameters:
        - $ref: '#/components/parameters/AmsatSatelliteParam'
        - $ref: '#/components/parameters/CallsignParam'
        - $ref: '#/components/parameters/AmsatStatusParam'
        - $ref: '#/components/parameters/SinceParam'
        - $ref: '#/components/parameters/UntilParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/AllParam'
      responses:
        '200':
          description: A page of AMSAT live status reports.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Last-Modified: { $ref: '#/components/headers/LastModified' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Cache-Status: { $ref: '#/components/headers/XCacheStatus' }
            X-Cache-Age: { $ref: '#/components/headers/XCacheAge' }
            X-Cache-TTL: { $ref: '#/components/headers/XCacheTTL' }
            Link: { $ref: '#/components/headers/Link' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Service-Version: { $ref: '#/components/headers/XServiceVersion' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AmsatEnvelope' }
              examples:
                firstPage: { $ref: '#/components/examples/AmsatStatusPage' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------------------------------------------------------------------------
  # AMSAT upstream API (v1), relayed verbatim
  #
  # These seven paths are a transparent proxy of https://status.amsat.org/api/v1/.
  # The body is AMSAT's own document, byte for byte -- NOT this service's
  # {meta, data} envelope -- so the schemas below describe THEIR shapes and a
  # client can follow AMSAT's documentation (see /v1/amsat/catalog's description
  # for the reference links).
  #
  # AMSAT asks clients not to poll more often than every 5 minutes. The cache
  # honours that per canonical URL (x-cache-ttl: 300) and only the documented
  # query parameters are forwarded; unknown ones are dropped and numeric ones are
  # clamped to the ranges published here, so a repeated request never reaches
  # AMSAT more than once per window.
  #
  # POST /reports.php is NOT proxied. This service is a read-only mirror, and
  # relaying writes would make it an anonymous relay into AMSAT's database; the
  # route answers 405. Submit observations directly to AMSAT.
  #
  # Measured 2026-11-03: catalog, reports, summary and both legacy shapes return
  # empty arrays because the upstream database is empty; statuses and health have
  # content. An empty `data` is the upstream's real state, not a failure here.
  # /v1/amsat/status is a DIFFERENT source (the amsat.org HTML page) and still
  # returns rows -- do not treat the two as interchangeable.
  # ---------------------------------------------------------------------------
  /v1/amsat/catalog:
    get:
      operationId: proxyAmsatCatalog
      summary: AMSAT satellite catalog (proxied)
      description: |
        Relay of `GET https://status.amsat.org/api/v1/catalog.php` — the satellites
        AMSAT tracks, with links and optional report statistics.

        Upstream reference:
        [`/api/v1/`](https://status.amsat.org/api/v1/),
        [`docs.php`](https://status.amsat.org/api/v1/docs.php),
        [`openapi.php`](https://status.amsat.org/api/v1/openapi.php).
      tags: [AMSAT]
      x-endpoint-id: amsat_catalog
      x-cache-ttl: 300
      x-upstream: https://status.amsat.org/api/v1/catalog.php
      parameters:
        - $ref: '#/components/parameters/AmsatNameParam'
        - $ref: '#/components/parameters/AmsatIncludeStatsParam'
      responses:
        '200':
          description: AMSAT's catalog document, unchanged.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Cache-Status: { $ref: '#/components/headers/XCacheStatus' }
            X-Cache-Age: { $ref: '#/components/headers/XCacheAge' }
            X-Cache-TTL: { $ref: '#/components/headers/XCacheTTL' }
            X-Amsat-Source: { $ref: '#/components/headers/XAmsatSource' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AmsatSatellite' }
                  meta:
                    type: object
                    additionalProperties: true
                    description: Counts and paging as the upstream produces them.
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/amsat/reports:
    get:
      operationId: proxyAmsatReports
      summary: AMSAT status reports, searchable (proxied)
      description: |
        Relay of `GET https://status.amsat.org/api/v1/reports.php` — the status
        reports stations have filed for the last hours or days.

        Read-only here: submitting a report is `POST` on the upstream and is not
        proxied, so this path has no working write counterpart.
      tags: [AMSAT]
      x-endpoint-id: amsat_reports
      x-cache-ttl: 300
      x-upstream: https://status.amsat.org/api/v1/reports.php
      parameters:
        - $ref: '#/components/parameters/AmsatNameParam'
        - $ref: '#/components/parameters/AmsatHoursParam'
        - name: since
          in: query
          description: Only reports at or after this instant. Canonicalised to RFC 3339 UTC before the cache key is computed.
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/AmsatLimitParam'
        - name: callsign
          in: query
          description: Reporter callsign, exact match.
          schema: { type: string }
        - name: grid_square
          in: query
          description: Maidenhead grid square, up to 6 characters.
          schema: { type: string }
        - $ref: '#/components/parameters/AmsatReportStatusParam'
      responses:
        '200':
          description: AMSAT's report search document, unchanged.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Cache-Status: { $ref: '#/components/headers/XCacheStatus' }
            X-Cache-Age: { $ref: '#/components/headers/XCacheAge' }
            X-Cache-TTL: { $ref: '#/components/headers/XCacheTTL' }
            X-Amsat-Source: { $ref: '#/components/headers/XAmsatSource' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AmsatUpstreamReport' }
                  meta:
                    type: object
                    additionalProperties: true
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: proxyAmsatReportsRejected
      summary: Not proxied (read-only service)
      description: |
        AMSAT's `POST /reports.php` submits an observation. This service relays
        reads only, so the method is answered with `405` and an `Allow: GET, HEAD`
        header. Submit the report to AMSAT directly.
      tags: [AMSAT]
      deprecated: true
      responses:
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

